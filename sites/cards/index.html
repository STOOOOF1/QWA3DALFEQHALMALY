<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--ink:#14302f;--teal:#0f5c5a;--teal2:#1b7f7a;--tealL:#e3f1ef;--gold:#b8892f;--goldL:#f7efdc;--rose:#9c3d3d;--gray:#5d6b6a;--line:#cfe0dd;--bg:#f3f7f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
header h1{font-size:19px;font-weight:900;color:var(--teal);line-height:1.3}
header h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--gray)}
.btn{font-family:inherit;border:none;cursor:pointer;border-radius:12px;font-weight:700}
#menuBtn{background:#fff;color:var(--teal);border:1px solid var(--line);padding:9px 13px;font-size:14px;white-space:nowrap}

.prog .row{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:6px}
.bar{height:8px;background:var(--tealL);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--gold));border-radius:9px;transition:width .4s}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.lv{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:8px 5px 7px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink)}
.lv .t{font-size:12.5px;font-weight:800;line-height:1.25}.lv .t b{display:block;color:var(--teal);font-size:15px}
.lv .c{font-size:11.5px;color:var(--gray);margin:3px 0 4px}
.lv .mini{height:4px;background:var(--tealL);border-radius:4px;overflow:hidden}.lv .mini i{display:block;height:100%;background:var(--teal2)}
.lv.on{border-color:var(--teal);background:var(--tealL)}
.lv.lock{opacity:.5}
.lv .badge{position:absolute;top:-7px;left:-5px;background:var(--gold);color:#fff;border-radius:50%;width:21px;height:21px;font-size:12px;line-height:21px}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 22px rgba(15,92,90,.10);overflow:hidden;animation:pop .35s ease}
.card::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--teal),var(--gold))}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cin{padding:16px 18px 18px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.chap{background:var(--goldL);color:#7a5a16;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:700}
.pos{font-size:12.5px;color:var(--gray)}
.card h2{font-size:20px;font-weight:900;color:var(--teal);line-height:1.45;margin-bottom:10px}
.done-tag{display:inline-block;background:var(--tealL);color:var(--teal);border-radius:7px;font-size:12px;padding:1px 8px;margin-bottom:8px;font-weight:700}
.body{font-size:16.5px;line-height:1.85}
.body b{color:var(--teal)}
.body .k{background:var(--teal);color:#fff;border-radius:6px;padding:0 6px;font-weight:700}
.body .v{color:#7a5a16;font-weight:700}
.body table{width:100%;border-collapse:collapse;margin:6px 0;font-size:14.5px;line-height:1.6}
.body th{background:var(--teal);color:#fff;padding:5px 7px;text-align:right}
.body td{border-bottom:1px solid var(--line);padding:5px 7px;vertical-align:top}
.body tr:nth-child(even) td{background:#f5faf9}
.acts{display:flex;gap:8px;margin-top:14px}
#ok{flex:1;background:var(--teal);color:#fff;padding:14px;font-size:17px}
#ok:active{transform:scale(.98)}
#later{background:var(--goldL);color:#7a5a16;padding:14px 16px;font-size:15px}
.sub{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--gray)}
.link{background:none;border:none;color:var(--teal2);font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.link:disabled{opacity:.35;cursor:default}
.finish{text-align:center;padding:30px 20px}
.finish .e{font-size:54px}.finish h2{margin:8px 0}.finish p{color:var(--gray);line-height:1.8;margin-bottom:16px}
.finish .btn{display:block;width:100%;padding:13px;font-size:16px;margin-top:8px}
.pri{background:var(--teal);color:#fff}.sec{background:var(--tealL);color:var(--teal)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%)}
#sheet{position:fixed;inset:0;background:rgba(20,48,47,.45);display:none;z-index:20}
#sheet.open{display:block}
.panel{position:absolute;bottom:0;left:0;right:0;max-width:620px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;max-height:80vh;display:flex;flex-direction:column}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph b{font-size:16px;color:var(--teal)}
.list{overflow:auto;padding:6px 10px}
.it{display:flex;gap:9px;align-items:center;width:100%;text-align:right;background:none;border:none;border-bottom:1px solid #eef4f3;padding:10px 6px;font-family:inherit;font-size:14.5px;color:var(--ink);cursor:pointer}
.it .s{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:12px;line-height:20px;text-align:center}
.it.d .s{background:var(--teal);border-color:var(--teal);color:#fff}
.it.cur{background:var(--goldL);border-radius:9px}
.pf{padding:12px 16px;border-top:1px solid var(--line)}
#reset{width:100%;background:#fff;color:var(--rose);border:1px solid #e7c9c4;padding:10px;font-size:14px}
.confirm{display:none;margin-top:8px;background:#f6e6e3;border-radius:12px;padding:10px;font-size:14px;text-align:center}
.confirm.show{display:block}
.confirm .btn{padding:8px 16px;margin:6px 4px 0;font-size:14px}
.proglink{display:flex;align-items:center;gap:10px;margin:-2px 0 12px;font-size:12px;color:#5d6b6a;line-height:1.5}.proglink button{flex:none;font:inherit;font-size:12.5px;font-weight:800;color:#0f5c5a;background:#e3f1ef;border:1px solid #cfe0dd;border-radius:99px;padding:6px 12px;cursor:pointer}
.enrn{background:#f3f5fb;border:1px dashed #c9cfe6;border-radius:12px;padding:8px 12px;margin:0 0 10px;font-size:14.5px;line-height:1.6;color:#3d4a7a}.enrn a{color:#3d4a7a;font-weight:700}

<script>
const LEVELS=[{n:1,name:"الصورة الكبرى"},{n:2,name:"المفاهيم"},{n:3,name:"التفاصيل"},{n:4,name:"الإتقان"}];
const C=[
// ================= المستوى 1: الصورة الكبرى (10) =================
[1,"المدخل","ما القواعد الفقهية؟ ولماذا ندرسها؟","<span class='k'>القاعدة الفقهية</span> حكم شرعي عام كلي يجمع مسائل من أبواب متعددة.<br>الفقه الإسلامي، وعلى رأسه فقه المعاملات المالية، مبني على قواعد وضوابط، و<b>لا يُتصوَّر ترشيد الاقتصاد</b> وفق المنهج الإسلامي بدون معرفتها. والمقرر قسمان: <b>قواعد</b> تضبط الفروع، و<b>مقاصد</b> توجّهها."],
[1,"القاعدة 1","الأمور بمقاصدها","أولى القواعد الخمس الكبرى. فرعها في المال: <b>العبرة في العقود للمقاصد والمعاني لا للألفاظ والمباني</b>.<br>فالعقد يُحكم عليه بحقيقته لا باسمه: تسمية الزيادة على الدين «غرامة» لا تخرجها عن كونها <b>ربا</b>."],
[1,"القاعدة 2","المشقة تجلب التيسير","المشقة الطارئة على المكلف توجب الترخيص والتخفيف؛ لأن الشريعة مبنية على <b>التيسير لا التعسير</b>.<br>من فروعها في المال: <b>الغرر الكثير يفسد العقود دون يسيره</b>، و<b>إذا زال المانع عاد الممنوع</b>."],
[1,"القاعدة 3","لا ضرر ولا ضرار","نص نبوي صار قاعدة: الشريعة تنفي الضرر بمنعه قبل وقوعه ورفعه بعد وقوعه.<br>تتفرع عنها قواعد <span class='k'>الضمان</span>: الأموال تُضمن بالخطأ كالعمد · الاضطرار لا يبطل حق الغير · المباشر ضامن وإن لم يتعدَّ · الأجر والضمان لا يجتمعان · الظفر بالحق."],
[1,"القاعدة 4","اليقين لا يزول بالشك","ما ثبت بيقين لا يرتفع بمجرد الشك.<br>وفي العقود يتفرع عنها ثلاثة أصول: <b>الأصل في العقود والشروط الحِلّ</b> · <b>الأصل في العقود اللزوم</b> · <b>الأصل أن تكون عن تراضٍ</b>."],
[1,"القاعدة 5","العادة محكّمة","العرف والعادة حَكَمٌ يُرجع إليه في إثبات الحكم ما لم يخالف نصًّا. فـ<b>المعروف عرفًا كالمشروط شرطًا</b>.<br>ويلحق بها قاعدتان كليتان فرعيتان: <b>التابع تابع</b>، و<b>إعمال الكلام أولى من إهماله</b>."],
[1,"الموضوع 4","قواعد الضمان","تحدد من يتحمل الخسارة ومن يستحق الغلة:<br>• <b>الخراج بالضمان</b> و<b>الغنم بالغرم</b>: من عليه الخسارة فله الربح.<br>• <b>الجواز الشرعي ينافي الضمان</b>: الفعل المأذون فيه لا يوجب تعويضًا.<br>• <b>فاسد العقود كصحيحها في الضمان</b>."],
[1,"الموضوع 5","قواعد العقود والديون","خمس قواعد تضبط أثر العقود:<br>هل تُقضى الديون بأمثالها؟ · للأكثر حكم الكل · العقد الباطل لا يقبل الإجازة · لا يتم التبرع إلا بالقبض · هل الوعد عقد؟"],
[1,"الموضوع 7–8","المصالح والمفاسد والضروريات الخمس","الشريعة جاءت بجلب المصالح ودرء المفاسد، والمصالح مراتب: <b>ضرورية ثم حاجية ثم تحسينية</b>.<br>والضروريات خمس: حفظ <b>الدين والنفس والعقل والنسل والمال</b>. وعند التعارض يُرجَّح بينها بمرجّحات محددة."],
[1,"الموضوع 9–10","مقاصد الشريعة في المال","المال من الضروريات الخمس، وغاية الشريعة فيه أن <b>يُحفظ ويُنمّى ويتداول بعدل</b>.<br>ويُدرس المقصد في كل مرحلة من حياة المال: <b>الكسب والاستثمار</b>، و<b>الاستهلاك</b>، و<b>التبرع</b>، ثم أثر ذلك في المعاملات المعاصرة."],

// ================= المستوى 2: المفاهيم (20) =================
[2,"المدخل","تعريف القاعدة","<b>لغة:</b> الأساس.<br><b>اصطلاحًا:</b> حكم شرعي عام كلي، يتضمن مسائل من أبواب متعددة.<br>قد ترد عليها استثناءات لا تنقض كليتها، قال الشاطبي: «القاعدة الكلية لا تقدح فيها قضايا الأعيان ولا نوادر التخلف»."],
[2,"المدخل","القاعدة والضابط والأصل","<table><tr><th>المصطلح</th><th>يجمع الفروع من</th></tr><tr><td>القاعدة</td><td>أبواب شتى</td></tr><tr><td>الضابط</td><td>باب واحد</td></tr><tr><td>الأصل</td><td>الأعم: كل ما تنبني عليه مسائل، من باب أو أبواب</td></tr></table>"],
[2,"المدخل","لا تخلط: الفقهية والأصولية","<b>القواعد الأصولية:</b> أدلة عامة يُتوصل بها إلى <span class='k'>استنباط</span> الأحكام.<br><b>القواعد الفقهية:</b> تعبّر عن <span class='k'>أحكام</span> عامة، هدفها ضبط المسائل متحدة العلة تحت حكم كلي، على أن منها ما يصلح دليلًا.<br>الأولى أداة، والثانية ثمرة."],
[2,"المدخل","أقسام القواعد الفقهية","<b>1) كلية متفق عليها:</b><br>أ. ذات الفروع الكثيرة (الخمس الكبرى): الأمور بمقاصدها · اليقين لا يزول بالشك · المشقة تجلب التيسير · الضرر يزال · العادة محكّمة.<br>ب. مشتهرة أقل شأنًا: إعمال الكلام أولى من إهماله · الميسور لا يسقط بالمعسور.<br><b>2) مختلف فيها:</b> الأجر والضمان لا يجتمعان (الحنفية) · الرخص لا تناط بالمعاصي."],
[2,"المدخل","حجية القواعد: ثلاث مراتب","1) المأخوذة من <b>نص صريح</b> في الكتاب أو السنة: أعلى مراتب الحجية.<br>2) المستندة إلى <b>استقراء أو قياس</b>: دونها.<br>3) المبنية على <b>اجتهاد محض أو مصلحة مرسلة</b>: أضعف.<br>فحجية القاعدة <span class='k'>تابعة لقوة مستندها</span>."],
[2,"القاعدة 1","العبرة في العقود للمقاصد: المعنى والصيغ","<b>المعنى:</b> لا يُنظر إلى ألفاظ العاقدين بل إلى مقاصدهم الحقيقية؛ فما الألفاظ إلا قوالب للمعاني.<br><b>صيغها:</b><br>• العبرة في العقود للمقاصد والمعاني لا للألفاظ والمباني.<br>• القصود معتبرة في العقود.<br>• الألفاظ مفتقرة إلى معرفة معانيها.<br>• هل العبرة بصيغ العقود أو بمعانيها؟"],
[2,"فرع القاعدة 2","الغرر: اليسير والكثير","<b>الغرر:</b> كل عقد يحتمل فيه أحد المتعاقدين ألا يحصل على المقصود منه بسبب الغبن أو الجهالة.<br><b>اليسير:</b> القليل الذي يُغتفر عادةً، ولا يترتب عليه نزاع أو غبن فاحش.<br><b>الكثير:</b> ما لا يُغتفر، ويؤدي إلى النزاع أو الغبن.<br>القاعدة: <span class='k'>الكثير يفسد العقد دون اليسير</span>."],
[2,"القاعدة 3","الضرر والضرار","<b>الضرر لغة:</b> حصول الضُّر، وهو خلاف النفع.<br><b>اصطلاحًا:</b> الإخلال بمصلحة مشروعة للنفس أو الآخرين تعديًا أو إهمالًا.<br><b>الضرر:</b> إلحاق الأذى بالغير <b>ابتداءً</b>.<br><b>الضِّرار:</b> <b>مقابلة</b> الضرر بالضرر.<br>والحديث ينفيهما معًا."],
[2,"فرع القاعدة 3","الأموال تُضمن بالخطأ كالعمد","من أتلف مالًا بغير حق ضمنه، عامدًا أو مخطئًا، جاهلًا أو ناسيًا. والفرق بينهما في <b>الإثم</b> فقط: يأثم العامد دون المخطئ.<br><b>أسباب الضمان ثلاثة:</b> العقد · وضع اليد · الإتلاف."],
[2,"فرع القاعدة 3","الاضطرار: تعريفه وأقسامه","<b>الاضطرار:</b> حاجة شديدة عرفًا تُلجئ إلى مخالفة الشرع.<br>1) <b>داخلي:</b> سببه من الداخل كالجوع والعطش.<br>2) <b>خارجي (الإكراه):</b><br>• <b>ملجئ (تام):</b> يعدم الرضا ويفسد الاختيار.<br>• <b>غير ملجئ (ناقص):</b> يعدم الرضا ولا يفسد الاختيار."],
[2,"فرع القاعدة 3","الظفر بالحق: تعريفه","<b>لغة:</b> الفوز بالشيء وإدراكه بعد السعي فيه.<br><b>اصطلاحًا:</b> تمكّن صاحب الحق، أو من يقوم مقامه، من حقه الواجب الأداء من مال غريمه الممتنع عن الوفاء، وأخذه منه استيفاءً لحقه بغير إذنه ولا علم القضاء، بشروط مخصوصة."],
[2,"القاعدة 4","الأصول الثلاثة في العقود","<b>الحِلّ:</b> العقود والشروط مباحة ما لم يرد دليل بتحريمها.<br><b>اللزوم:</b> العقد المبرم لازم ما لم يدل نص أو شرط (كالخيار) على خلافه.<br>• البيع <b>اللازم</b>: النافذ العاري عن الخيارات · <b>غير اللازم</b>: النافذ الذي فيه خيار.<br><b>التراضي:</b> المعتبر في حلّ العقد ونفوذه ولزومه رضا الطرفين."],
[2,"القاعدة 5","العادة محكّمة: المعنى","تُجعل العادة، عامة أو خاصة، <b>حَكَمًا لإثبات حكم شرعي</b> لم يُنص على خلافه بخصوصه. فالعادة التي توفرت فيها شروط العمل بها <b>ملزمة</b>.<br>ومن ألفاظها: المعروف بين التجار كالمشروط بينهم · العرف كالشرط · الإذن العرفي كالإذن اللفظي."],
[2,"قواعد فرعية","التابع تابع · إعمال الكلام","<b>التابع تابع:</b> ما كان تابعًا لشيء في الوجود حقيقة أو حكمًا فهو تابع له في حكمه، ولا يستقل بالحكم.<br><b>إعمال الكلام أولى من إهماله:</b> حمل الكلام على معنى صحيح أفضل من تركه وعدم الأخذ به."],
[2,"الموضوع 4","الخراج والغنم والغرم","<b>الخراج لغة:</b> غلة الشيء ودخله ومنفعته.<br><b>الغلة:</b> الدخل من الزرع والثمر واللبن والإجارة والنتاج.<br><b>الخراج بالضمان:</b> الغلة لمن يتحمل ضمان الأصل.<br><b>الغرم:</b> ما يلزم المرء لقاء شيء · <b>الغنم:</b> ما يحصل له من مرغوبه."],
[2,"الموضوع 5","لا تخلط: الوعد والعقد","<b>الوعد:</b> إخبار عن إنشاء معروف في المستقبل، والتزام من <b>طرف واحد</b>.<br><b>العقد:</b> التزام صادر من <b>طرفين متقابلين</b>، وإنشاء لالتزامات آنية متبادلة.<br><b>الوعد المجرد:</b> إخبار بالنية · <b>الوعد الملزم:</b> ما اقترن بتصرف من الموعود بناءً عليه."],
[2,"الموضوع 4","الصحيح والفاسد والباطل","<b>البيع الصحيح:</b> ما شُرع بأصله ووصفه، وترتب عليه أثره من الملك والانتفاع.<br>الجمهور: <b>الفاسد = الباطل</b>.<br>الحنفية: <b>الفاسد</b> ما شُرع بأصله دون وصفه، ويُصلح ويبقى أثره · <b>الباطل</b> ما لم يُشرع بأصله ولا وصفه، فكأنه لم يكن."],
[2,"الموضوع 7","مراتب المصالح","<b>ضرورية:</b> لا بد منها لقيام مصالح الدين والدنيا، وبفقدها فساد وتهارج.<br><b>حاجية:</b> للتوسعة ورفع الحرج، وبفقدها حرج ومشقة لا فساد.<br><b>تحسينية:</b> محاسن العادات ومكارم الأخلاق.<br>والمفاسد تنقسم مثلها: كل ما فوّت مصلحة فهو مفسدة في رتبتها."],
[2,"الموضوع 8","الضروريات الخمس ومقاصد الاقتصاد","<b>الضروريات:</b> حفظ الدين · النفس · العقل · النسل · المال.<br><b>مقاصد الاقتصاد الإسلامي (5):</b><br>1) العدالة الاجتماعية.<br>2) التوازن بين مصلحة الفرد والجماعة.<br>3) الرقابة الذاتية.<br>4) عمارة الأرض.<br>5) القوة الاقتصادية."],
[2,"الموضوع 9–10","المال والكسب والاستثمار والاستهلاك والتبرع","<b>المال (الراجح):</b> ما تخرج منه المنافع ويُباح الانتفاع به.<br><b>الكسب:</b> تحصيل المال بطريق مشروع لتحقيق الكفاية.<br><b>الاستثمار:</b> توظيفه في أنشطة مباحة تحقق النماء.<br><b>الاستهلاك:</b> استخدام السلع والخدمات لإشباع الحاجات بالضوابط الشرعية.<br><b>التبرع:</b> بذل مال أو منفعة بلا عوض بقصد البر."],

// ================= المستوى 3: التفاصيل (30) =================
[3,"المدخل","فوائد القواعد الفقهية (6)","1) تجمع شتات الفروع المتناثرة في سلك واحد.<br>2) تكوّن لدى الباحث <b>ملكة علمية</b> قوية.<br>3) تنير سبيل معرفة الأحكام، وترتقي إلى النظريات العامة.<br>4) تصوّر منهجًا قياسيًا عامًا في ترتيب الأحكام.<br>5) دقة ميزانها تتيح لغير المتخصص الاطلاع على الفقه.<br>6) <b>الإيجاز</b>: كلمتان أو بضع كلمات، مثل «العادة محكّمة»."],
[3,"المدخل","هل تُجعل القاعدة الفقهية دليلًا؟","<b>الأصل: لا</b>، لسببين:<br>1) هي ثمرة للفروع وجامع لها، فلا يُجعل الثمرة دليلًا.<br>2) معظمها لا يخلو من مستثنيات، فقد تكون المسألة منها.<br>فهي <b>شواهد يُستأنس بها</b>.<br><b>إلا</b> إن كانت نصًّا («لا ضرر ولا ضرار»، «الخراج بالضمان»)، فقوتها بقوة دليلها. وما بُني على دليل مختلف فيه يُرجع فيه أولًا إلى الأدلة المتفق عليها."],
[3,"المدخل","مستندات القواعد (4)","1) <b>الكتاب:</b> ﴿وأحل الله البيع وحرم الربا﴾ ← أصل الإباحة في البيوع، وحرمة الربا.<br>2) <b>السنة:</b> «ما حُرّم لعلة عارضة يزول بزوالها»، كحديث بريرة: «هو لها صدقة ولنا هدية».<br>3) <b>القياس الصحيح:</b> كقول الشافعي: «كل ما قسناه حلالًا حكمنا له حكم الحلال».<br>4) <b>الاستقراء:</b> أكثر طرق بناء القواعد شيوعًا."],
[3,"القاعدة 1","تطبيقات العبرة بالمقاصد","1) قال: «أعرتك سيارتي» مدة معلومة بعوض معلوم ← صح، و<b>انقلبت الإعارة إجارة</b> تغليبًا للمعنى، وبه قال أصحاب المذاهب الأربعة.<br>2) <b>تغريم المدين المماطل</b>: تسمية الزيادة على الدين «غرامة» لا تصرفها عن حقيقتها وهي الربا."],
[3,"القاعدة 1","المقاصد أم الألفاظ؟ أدلة الفريقين","<table><tr><th>العبرة بالمقاصد</th><th>العبرة بالألفاظ</th></tr><tr><td>«إنما الأعمال بالنيات»</td><td>الصيغ وُضعت لإفادة المعاني فلا تُترك ظواهرها</td></tr><tr><td>لا يُعطَّل لفظ العقد إن أمكن حمله على وجه صحيح</td><td>اعتبار النيات بلا ضبط يؤدي للتلاعب وغياب الضبط القضائي</td></tr><tr><td>آية لغو اليمين [البقرة: 225]</td><td>﴿فإن طلقها فلا تحل له﴾: أثر الطلاق باللفظ</td></tr><tr><td>اعتبار الألفاظ وحدها يبطل عقودًا ويفتح باب التحايل</td><td></td></tr></table>"],
[3,"القاعدة 2","ضابط المشقة الموجبة للتيسير","<b>1) ملازمة للعبادة:</b> لا تنفك عنها، فلا تخفيف (الوضوء في البرد، الصيام في الحر، السفر لطلب العلم).<br><b>2) عارضة:</b> ليست جزءًا من العبادة:<br>• <b>عظيمة:</b> تضر بالنفس أو الأعضاء ← توجب التخفيف.<br>• <b>خفيفة:</b> ألم يسير ← لا يُلتفت إليها.<br>• <b>متوسطة:</b> تُلحق بأقرب الطرفين."],
[3,"القاعدة 2","أنواع التخفيفات الشرعية (7)","1) <b>إسقاط:</b> قضاء الصلاة عن الحائض.<br>2) <b>تنقيص:</b> قصر الرباعية.<br>3) <b>إبدال:</b> التيمم عند فقد الماء.<br>4) <b>تقديم:</b> جمع الصلاتين في وقت الأولى.<br>5) <b>تأخير:</b> جمعهما في وقت الثانية.<br>6) <b>ترخيص:</b> أكل الميتة للضرورة.<br>7) <b>تغيير:</b> نظم صلاة الخوف."],
[3,"القاعدة 2","أسباب الرخص الشرعية (7)","1) السفر.<br>2) المرض.<br>3) الإكراه الملجئ.<br>4) النسيان.<br>5) الجهل.<br>6) العسر وعموم البلوى.<br>7) النقص."],
[3,"فرع القاعدة 2","كيف نميز الغرر اليسير من الكثير؟","لم يحدد الفقهاء قدرًا معينًا، وتركوه لمعيارين:<br>1) <span class='k'>العرف</span>: ما يعده الناس غررًا كثيرًا يؤدي إلى النزاع فهو فاسد، وما يتسامحون فيه فهو يسير. والعرف يتغير بالزمان والمكان ونوع العقد.<br>2) <span class='k'>الضوابط الشرعية</span>: وجود الضمانات والشفافية التي تزيل الجهالة والغبن؛ فكلما زادت إجراءات الوضوح والعدل قلّ الغرر."],
[3,"فرع القاعدة 2","تطبيقات الغرر المعاصرة","1) <b>التأمين التجاري:</b> غرر كثير مفسد؛ المؤمَّن لا يعلم أيحصل على مقابل، والشركة لا تدري كم ستدفع.<br>2) <b>التأمين التعاوني (التكافلي):</b> قائم على التبرع والتعاون، فيصير الغرر يسيرًا مغتفرًا.<br>3) <b>المشتقات</b> (الخيارات، الديون المشكوك في تحصيلها): بيع ما لا يملك، أو معدوم، أو مجهول ← داخلة في النهي عن بيع الغرر."],
[3,"فرع القاعدة 2","إذا زال المانع عاد الممنوع","<b>المعنى:</b> ما امتنع لمانع يعود إلى حكمه الأصلي إذا زال المانع.<br><b>الدليل:</b> ﴿وإذا حللتم فاصطادوا﴾، وحديث آكل الثوم: لا يقرب المسجد حتى يذهب ريحه.<br><b>تطبيقات:</b><br>• أوصى لأخيه ثم وُلد له ابن فحجبه ← صحت الوصية.<br>• وهب حصة شائعة ثم قسمها وسلّمها ← صحت.<br>• زالت الزيادة المانعة من رجوع الواهب ← عاد حقه."],
[3,"القاعدة 3","لا ضرر: ما تُلزم به وأمثلتها","<b>تُلزم بثلاثة:</b><br>1) منع الضرر قبل وقوعه.<br>2) رفعه بعد وقوعه ومنع تكراره.<br>3) تحريم سائر أنواعه إلا بدليل (النكرة في سياق النفي تعم).<br><b>بيوع ممنوعة للضرر:</b> بيع المعيب دون بيان · النجش والعينة والمزابنة والمنابذة · بيع الحاضر للبادي والبيع على البيع · بيع المخدرات والمغصوب · بيع الدين بالدين."],
[3,"فرع القاعدة 3","الاضطرار لا يبطل حق الغير: المعنى","من أتلف شيئًا <b>لدفع أذاه عنه</b> لم يضمنه، ومن أتلفه <b>ليدفع به ضرورته</b> ضمنه.<br>• صال عليه بعير فقتله ← <b>لا يضمن</b>.<br>• جاع جوعًا شديدًا فذبح البعير وأكل ← <b>يضمن</b>.<br>فالضرورة ترفع الإثم ولا ترفع الضمان."],
[3,"فرع القاعدة 3","شروط قاعدة الاضطرار (6)","1) وقوع الضرر يقينًا أو غالبًا.<br>2) أن يمس إحدى الضروريات الخمس.<br>3) تعذر إزالته بالوسائل المباحة.<br>4) ألا يترتب على إزالته ضرر مثله أو أعظم.<br>5) أن يقتصر المضطر على ما يزيل الضرر.<br>6) أن يضمن ما أتلفه من حق الغير."],
[3,"فرع القاعدة 3","الأجر والضمان: الحنفية والجمهور","<b>الحنفية:</b> لا يجتمعان في محل واحد لسبب واحد مع اتحاد الجهة؛ لأن الضمان يقتضي التملك، والمالك لا أجر عليه. ومنافع المغصوب عندهم غير مضمونة لأنها معدومة.<br><b>الجمهور:</b> يجتمعان، كالغاصب المنتفع بالمغصوب إذا هلك: يضمنه وعليه الأجرة.<br>فالقاعدة <span class='k'>مختلف فيها</span>."],
[3,"فرع القاعدة 3","الأجر والضمان: مسائل الدابة","<table><tr><th>استأجر دابة ثم</th><th>الحكم</th></tr><tr><td>تعدى ولم ينتفع وسلمت</td><td>لا أجر</td></tr><tr><td>تعدى ثم انتفع وسلمت</td><td>لا أجر</td></tr><tr><td>انتفع كاملًا ثم تعدى</td><td>كل الأجر مع الإثم</td></tr><tr><td>تعدى أثناء المنفعة، أو بعد بعضها</td><td>أجر ما قبل التعدي</td></tr><tr><td>تعدى ولم ينتفع وتلفت</td><td>يضمن القيمة ولا أجر</td></tr></table>"],
[3,"فرع القاعدة 3","الظفر بالحق: الشروط والموانع","<b>الشروط (5):</b> ثبوت الحق ويقينيته · عدم التجاوز · تعذر الطرق المشروعة · الأمن من الفتنة والعقوبة · أن يكون مالًا لا حدًّا ولا قصاصًا.<br><b>الموانع (4):</b> وجود قضاء عادل · إمكان إقامة البينة · أن يكون المدين معسرًا أو محجورًا عليه · أن يؤدي إلى مفسدة أعظم.<br><b>الراجح:</b> يجوز إن كان سبب الحق ظاهرًا كالنكاح والقرابة والضيافة."],
[3,"القاعدة 4","الأصل في العقود الحل: الضوابط والتطبيقات","<b>المقاصد:</b> تحقيق مصالح الناس · رفع الحرج · حفظ الحقوق ومنع النزاع.<br><b>الضوابط:</b> ألا تخالف نصًّا · ألا تنافي مقصود العقد · ألا تشتمل على غرر أو ظلم.<br><b>تطبيقات:</b> اشتراط صفة في المبيع (جمل جابر) · تحديد المدة أو المنفعة في الإجارة · <b>الشروط الجزائية والتأمين التعاوني</b>."],
[3,"القاعدة 4","الأصل في العقود اللزوم: شروط إعماله","1) أن يكون العقد صحيحًا موافقًا للشريعة.<br>2) أن يثبت بالإيجاب والقبول ورضا المتعاقدين.<br>3) ألا يوجد ما يناقض اللزوم.<br>4) ألا يوجد ما يناقض مقتضى العقد.<br>5) أن يكون الشرط واضحًا لا تغرير فيه بالطرف الآخر."],
[3,"القاعدة 4","التراضي: الشروط والقواعد المندرجة","<b>شروطه:</b> ألا يكون على إحلال حرام أو تحريم حلال · ألا يناقض مقصود العقد · ألا يوجد سبب قوي لإهدار رضا المالك.<br><b>قواعد مندرجة:</b><br>1) تنعقد العقود بكل ما دل على مقصودها.<br>2) دليل الرضا كصريح الرضا.<br>3) السكوت لا يدل على الرضا إلا بقرينة.<br>4) لا عبرة للدلالة في مقابلة التصريح."],
[3,"القاعدة 5","شروط العمل بالعرف","1) أن يكون <b>مطردًا أو غالبًا</b>.<br>2) أن يكون <b>قائمًا عند إنشاء التصرف</b>، فلا عبرة بسابق منقطع ولا بحادث بعده.<br>3) <b>ألا يعارضه تصريح</b> بخلافه.<br>4) <b>ألا يخالف دليلًا شرعيًا</b>.<br><b>ضابط الرجوع إليه:</b> كل فعل رُتّب عليه حكم ولا ضابط له في الشرع ولا في اللغة، كالقبض والإيداع والهدية والغصب."],
[3,"القاعدة 5","تطبيقات العرف المعاصرة","1) <b>عمولة مكاتب الإيجار</b> على المستأجر، وتتفاوت بحسب أجرة المسكن.<br>2) <b>تسلّم الشيك</b> يقوم مقام القبض في صرف النقود بشروطه.<br>3) <b>القيد الحسابي</b> قبض حكمي في شراء الذهب والفضة.<br>4) خدمات الحسابات الجارية: دفاتر الشيكات وبطاقات الصراف وتمييز بعض العملاء، عملًا بـ«المعروف بين التجار كالمشروط بينهم»."],
[3,"القاعدة 5","لا تخلط: المعروف عرفًا · المعروف بين التجار","<b>المعروف عرفًا كالمشروط شرطًا:</b> في مطلق العرف؛ ما تعارفه الناس بلا شرط صريح فهو كالمشروط، ما لم يصادم نصًّا. (مثال المصادم: تضمين المستعير والمستأجر بلا تعدٍّ ← لا يُعتبر).<br><b>المعروف بين التجار كالمشروط بينهم:</b> <span class='k'>أخص</span>، في عرف التجار، وذُكرت اهتمامًا بالتجارة. مثالها: دفع الثمن منجّمًا إن جرى به العرف."],
[3,"قواعد فرعية","صور التبعية (6)","1) <b>حقيقية:</b> الصوف على الغنم، والجنين في الرحم.<br>2) <b>متولدة:</b> الإذن بشيء يتبعه ما ينتج عنه.<br>3) <b>تضمنية:</b> جزء مما تضمنه شيء آخر.<br>4) <b>ضرورية:</b> المفتاح للقفل.<br>5) <b>شرعية:</b> «ذكاة الجنين ذكاة أمه».<br>6) <b>عرفية:</b> ما يتبع العقد عرفًا كالأرض والبناء والشجر."],
[3,"الموضوع 4","الخراج بالضمان: الشروط والتطبيقات","<b>الشرطان:</b> منفعة <b>منفصلة غير متولدة</b> كالأجرة · مستندة إلى <b>سبب مشروع</b> كالشراء والهبة.<br><b>تطبيقات:</b><br>• ردّ المبيع المعيب بعد استعماله ← لا أجرة عليه.<br>• رجع الواهب ← الغلة للموهوب له.<br>• المفلس يتّجر بعد الحجر ← الربح له.<br>• مكّنه البائع من الطعام فلم يقبضه فهلك ← من ضمان المشتري."],
[3,"الموضوع 4","فاسد العقود كصحيحها في الضمان","يستويان في <b>أصل</b> الضمان لا في <b>مقداره</b>:<br>• الصحيح يُضمن <b>بالمسمّى</b> (ضمان عقد).<br>• الفاسد يُضمن <b>بالقيمة أو المثل</b> (ضمان يد).<br><b>وقت القيمة:</b> يوم القبض (الحنفية والمالكية ووجه للشافعية) · يوم التلف (الحنابلة، لأنه مأذون في إمساكه كالعارية).<br>مثال: باع قطيعًا إلا شاتين غير معينتين ← فاسد للجهالة."],
[3,"الموضوع 5","تُقضى الديون بأمثالها: المجمع والتحوط","الأصل ردّ <b>المثل</b> ولو رخصت العملة أو غلت، باتفاق المذاهب الأربعة.<br><b>مجمع الفقه (التضخم):</b> العبرة بالمثل لا بالقيمة، فلا يجوز ربط الديون بمستوى الأسعار.<br><b>التحوط عند التعاقد:</b> عقد الدين بالذهب أو الفضة · سلعة مثلية · سلة سلع · عملة أثبت · سلة عملات. ويُرد بمثل ما وقع به الدين."],
[3,"الموضوع 7","الترجيح بين المصالح والمفاسد (6)","1) <b>الرتبة:</b> دفع مفسدة الضروري مقدّم على مصلحة الحاجي.<br>2) <b>النوع:</b> الدين، فالنفس، فالعقل، فالنسل، فالمال.<br>3) <b>العموم:</b> المفسدة العامة على المصلحة الخاصة.<br>4) <b>القدر:</b> الأكبر ضررًا يُقدَّم درؤه.<br>5) <b>الزمن:</b> المفسدة الدائمة على المصلحة المؤقتة.<br>6) <b>التحقق:</b> درء المفسدة المحققة أولى من جلب المصلحة الموهومة."],
[3,"الموضوع 8","إعمال المقاصد: الخطوات والضوابط","<table><tr><th>خطوات الإعمال</th><th>ضوابط الإعمال</th></tr><tr><td>فهم النص أولًا</td><td>عدم معارضة النصوص</td></tr><tr><td>الاستقراء الشامل</td><td>عدم معارضة الإجماع والقياس</td></tr><tr><td>ترتيب المقاصد</td><td>تحديد درجة المقصد</td></tr><tr><td>مراعاة المآلات</td><td>الابتعاد عن المصالح الموهومة</td></tr><tr><td>الالتزام بالضوابط</td><td>أن يكون المطبّق مجتهدًا</td></tr></table>"],
[3,"الموضوع 10","التبرعات: أنواعها ومقاصدها","<b>الأنواع:</b> 1) مقصودة ابتداءً وانتهاءً (هبة، صدقة، وصية، وقف، عارية). 2) ضمن معاوضة (بيع بأقل من القيمة نفعًا للمشتري). 3) تبرع ابتداءً معاوضة انتهاءً (القرض).<br><b>المقاصد:</b> عبادة الله · مصالح ضعاف المسلمين · إدامة استخدام المال · التكثير منها · صدورها عن طيب نفس."],

// ================= المستوى 4: الإتقان (40) =================
[4,"القاعدة 2","أدلة: المشقة تجلب التيسير","1) <span class='v'>﴿يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ﴾</span> [البقرة: 185].<br>2) <span class='v'>﴿وَمَا جَعَلَ عَلَيْكُمْ فِي الدِّينِ مِنْ حَرَجٍ﴾</span> [الحج: 78].<br>3) قصة الأعرابي الذي بال في المسجد: «دعوه، وأهريقوا على بوله ذَنوبًا من ماء... فإنما بُعثتم ميسّرين ولم تُبعثوا معسّرين» (البخاري)."],
[4,"القاعدة 2","أمثلة المشقة العارضة","<table><tr><th>النوع</th><th>مثاله</th><th>حكمه</th></tr><tr><td>عظيمة</td><td>خوف الهلاك أو فقد عضو بالصيام</td><td>تخفيف</td></tr><tr><td>خفيفة</td><td>وجع إصبع، صداع خفيف</td><td>لا تخفيف</td></tr><tr><td>متوسطة</td><td>حمى خفيفة، ألم ضرس</td><td>بحسب قربها</td></tr></table>"],
[4,"فرع القاعدة 2","أدلة قاعدة الغرر","1) <span class='v'>﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ إِلَّا أَن تَكُونَ تِجَارَةً عَن تَرَاضٍ مِّنكُمْ﴾</span> [النساء: 29]: والغرر يؤدي إلى أكل المال بالباطل لانعدام الرضا الحقيقي.<br>2) حديث أبي هريرة: «نهى رسول الله صلى الله عليه وسلم عن بيع الغرر». النهي عام، وقيّده الفقهاء بالكثير المؤدي للنزاع."],
[4,"القاعدة 3","أدلة: لا ضرر ولا ضرار","1) <span class='v'>﴿وَلَا يُضَارَّ كَاتِبٌ وَلَا شَهِيدٌ﴾</span> [البقرة: 282].<br>2) <span class='v'>﴿لَا تُضَارَّ وَالِدَةٌ بِوَلَدِهَا وَلَا مَوْلُودٌ لَّهُ بِوَلَدِهِ﴾</span> [البقرة: 233].<br>3) قول النبي صلى الله عليه وسلم: «لا ضرر ولا ضرار» (أحمد)، وهو <b>أصل القاعدة</b>."],
[4,"فرع القاعدة 3","ضمان الخطأ: الأدلة والأمثلة","<b>الأدلة:</b> آية النساء 29 · «إن دماءكم وأموالكم وأعراضكم حرام عليكم كحرمة يومكم هذا» (أبو بكرة)، ولم يفرق الشارع بين العالم وغيره في ضمان المتلفات.<br><b>قول ابن رشد:</b> «الأموال تُضمن عمدًا أو خطأً».<br><b>أمثلة:</b> أعطى زكاته لمن ظنه فقيرًا فبان غنيًا ← يضمن الآخذ · رمى حجرًا فكسر زجاج سيارة ← يضمن إصلاحه."],
[4,"فرع القاعدة 3","حديث عُمير مولى آبي اللحم","أصابته مجاعة شديدة قرب المدينة، فدخل حائطًا وقطع قِنوَين من نخلة، فجاء به صاحب الحائط إلى النبي صلى الله عليه وسلم، فسأله: «أيّهما أفضل؟» يعني ثوبيه، فأخذ عمير أحدهما وأخذ صاحب الحائط الآخر.<br><b>وجه الدلالة:</b> كان مضطرًا، ومع ذلك أعطى صاحبَ البستان عوضًا ← <span class='k'>الاضطرار لا يبطل حق الغير</span>."],
[4,"فرع القاعدة 3","الاضطرار: الصيغ والأركان والأدلة","<b>صيغها:</b> الضرورات لا تبيح إتلاف مال الغير بغير ضمان · الضرورة إلى مال الغير لا تُسقط ضمانه · الاضطرار لا يُسقط الضمان.<br><b>أركانها نظريًا:</b> الاضطرار (المحكوم عليه)، وعدم بطلان حق الغير (المحكوم به). <b>تطبيقيًا:</b> المضطر · حالة الضرورة · حق للغير · التعدي عليه.<br><b>آيات المضطر:</b> البقرة 173 · المائدة 3 · الأنعام 119 و145 · النحل 115: تنفي الإثم لا الضمان."],
[4,"فرع القاعدة 3","تطبيقات الاضطرار في المعاملات","1) أكره شخص غيره على إتلاف مال ثالث ← لا يبطل حق المالك؛ يُضمَّن <b>المُكرِه</b> إن كان الإكراه ملجئًا، وإلا فالضمان على <b>المتلف المباشر</b>.<br>2) استأجر سيارة مدة فانتهت واحتُجزت لسبب من المستأجر ← تستمر الإجارة، ولصاحبها <b>أجرة المثل</b> للمدة الزائدة."],
[4,"فرع القاعدة 3","المباشر ضامن: الأدلة والأمثلة","<b>الأدلة:</b> <span class='v'>﴿فَمَنِ اعْتَدَىٰ عَلَيْكُمْ فَاعْتَدُوا عَلَيْهِ بِمِثْلِ مَا اعْتَدَىٰ عَلَيْكُمْ﴾</span> [البقرة: 194] · «لا ضرر ولا ضرار».<br><b>أمثلة:</b> رمى شيئًا فسقط على مال غيره فأتلفه · زلق فوقع على مال فأتلفه · <b>موظف بنك حوّل مبلغًا إلى حساب خاطئ</b> ← ضامن لمباشرته.<br><b>لا تخلط:</b> المباشر يضمن مطلقًا، والمتسبب لا يضمن إلا بالتعدي."],
[4,"فرع القاعدة 3","مستثنى قاعدة الأجر والضمان","1) استأجر دابة لركوبه فأردف خلفه آخر، والدابة تطيقهما، فعطبت بعد بلوغ المقصد ← عليه <b>كل الأجر ونصف القيمة</b>، لعدم اتحاد جهة الأجر والضمان.<br>2) استأجر حمارًا لنقل التراب، فصار يحمل عليه اللَّبِن في رجوعه، فسلم الحمار ← يجب كل الأجر (وهو خلاف ما عليه الفتوى)."],
[4,"فرع القاعدة 3","أدلة الظفر بالحق","<b>من القرآن:</b> <span class='v'>﴿وَانتَصَرُوا مِن بَعْدِ مَا ظُلِمُوا﴾</span> [الشعراء: 227] · ﴿فَمَنِ اعْتَدَىٰ عَلَيْكُمْ...﴾ [البقرة: 194].<br><b>من السنة:</b><br>• <b>حديث هند بنت عتبة</b>: «خذي ما يكفيك وولدك بالمعروف»، وهو <b>أظهر دليل</b>، وقيّده بالمعروف.<br>• حديث عقبة بن عامر: إباحة أخذ الضيف حق الضيافة ممن امتنع عن قِراه."],
[4,"فرع القاعدة 3","حقوق يجوز الظفر بها وحقوق لا يجوز","<b>متفق على جوازه:</b><br>1) نفقة الزوجة والأولاد.<br>2) الأعيان المستحقة.<br><b>متفق على منعه:</b><br>1) تحصيل العقوبات.<br>2) الحقوق المتعلقة بالنكاح.<br>3) الدين المبذول."],
[4,"القاعدة 4","اليقين لا يزول بالشك: الدليل والتطبيقات","<b>الدليل:</b> «إذا وجد أحدكم في بطنه شيئًا فأشكل عليه أخرج منه شيء أم لا؟ فلا يخرجنّ من المسجد حتى يسمع صوتًا أو يجد ريحًا» (مسلم: 362).<br><b>تطبيقات:</b><br>• تيقن الطهارة وشك في الحدث ← الأصل الطهارة.<br>• ملك شيئًا بيقين ثم شك في زوال ملكه ← الأصل بقاء الملك."],
[4,"القاعدة 4","أدلة: الأصل في العقود والشروط الحِلّ","1) <span class='v'>﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾</span> [المائدة: 1].<br>2) «المسلمون على شروطهم، إلا شرطًا حرّم حلالًا أو أحلّ حرامًا» (الترمذي: حسن صحيح).<br>فقرر الفقهاء أن الأصل في العقود والشروط <b>الصحة والجواز</b> إلا ما تضمن محرّمًا أو خالف نصًّا."],
[4,"القاعدة 4","أدلة: الأصل في العقود اللزوم","1) <span class='v'>﴿أَوْفُوا بِالْعُقُودِ﴾</span>: أمر بالوفاء، و<b>الأمر يفيد الوجوب</b>.<br>2) حديث عقبة بن عامر: «إن أحق الشروط أن تُوفوا به ما استحللتم به الفروج»: الشروط عمومًا يجب الوفاء بها، وأوجبها ما كان في استحلال الفرج، ما لم يخالف الشرع."],
[4,"القاعدة 4","أدلة: الأصل في العقود التراضي","1) ﴿إِلَّا أَن تَكُونَ تِجَارَةً عَن تَرَاضٍ مِّنكُمْ﴾ [النساء: 29]: البيع بلا تراضٍ باطل.<br>2) <span class='v'>﴿فَإِن طِبْنَ لَكُمْ عَن شَيْءٍ مِّنْهُ نَفْسًا فَكُلُوهُ هَنِيئًا مَّرِيئًا﴾</span> [النساء: 4].<br>3) «إنما البيع عن تراض» (ابن ماجه)."],
[4,"القاعدة 4","مقصد قاعدة التراضي: حفظ المال","أ) <b>منع الاعتداء على المال</b> بتحريم الغصب والسرقة والإضرار، حرصًا على الملكية الخاصة؛ إذ جعل الله التراضي سبيل خروج المال من اليد في غير التبرع.<br>ب) <b>منع الغش والخديعة</b>، ونفي رضا من لا إرادة له كالمجنون والصبي غير المميز.<br>ج) <b>مقاصد اجتماعية</b> كدفع العداوة والبغضاء [المائدة: 91]."],
[4,"القاعدة 5","أدلة: العادة محكّمة","1) <span class='v'>﴿خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ﴾</span> [الأعراف: 199]: العرف عادات الناس وما استقر في النفوس.<br>2) «خذي ما يكفيك وولدك بالمعروف»: قال ابن المنير: المقصود إثبات الاعتماد على العرف، وأنه يُقضى به على ظواهر الألفاظ.<br>3) مشروعية <b>بيع السلم</b>.<br>4) <b>العرايا</b>: استُثنيت من المزابنة مراعاةً للعرف وحاجة الاقتيات."],
[4,"القاعدة 5","أمثلة العرف عند الفقهاء","1) <b>العيوب</b> في السلع بحسب ما عند الناس.<br>2) <b>القبوض</b> تختلف باختلاف الأشياء وعادات الناس.<br>3) <b>الالتزامات التبعية</b> عند السكوت: أجرة السمسار، وكتابة الصك، وأجرة الوزن والكيل والنقل.<br>4) لا يُقبل <b>هدية المقترض</b> قبل الوفاء ممن لم تجرِ عادته بها.<br>5) الوكيل يبيع بغير النقد المعروف ← لا يجوز."],
[4,"القاعدة 5","استثناءات العرف وأمثلة «كالمشروط»","<b>لا عبرة:</b><br>1) بالعرف الشاذ والنادر (لا حكم للنادر).<br>2) بعرف يعارض تصريحًا أو اشتراطًا من أحد الطرفين.<br>3) بعرف غير قائم وقت التصرف: «العرف الذي تُحمل الألفاظ عليه إنما هو المقارن أو السابق».<br><b>أمثلة المعروف عرفًا:</b> دخول البرذعة والإكاف في البيع · أجرة تعليم الحرفة لمن يشهد له عرف البلد · إدخال الحمّال المحمول داخل الباب."],
[4,"قواعد فرعية","التابع تابع: الأدلة والقواعد المندرجة","<b>الأدلة:</b> ﴿يَا أَيُّهَا النَّبِيُّ إِذَا طَلَّقْتُمُ النِّسَاءَ﴾ [الطلاق: 1]: خطاب المتبوع ثم عُمّم · «من باع نخلًا قد أُبّرت فثمرتها للبائع إلا أن يشترط المبتاع» · الإجماع على منع بيع الحمل دون أمه.<br><b>المندرجة:</b> من ملك شيئًا ملك ما هو من ضروراته · التابع لا يُفرد بالحكم · يُغتفر في التابع ما لا يُغتفر في غيره · إذا سقط الأصل سقط ما في ضمنه."],
[4,"قواعد فرعية","إعمال الكلام: التطبيقات والمندرجة","<b>تطبيقات:</b> وقف على «ولده» وله أحفاد فقط ← يُصرف إليهم مجازًا · تعارض الإعطاء والحرمان ← يُقدَّم الإعطاء لأنه أقرب لمقصود الواقف · حلف لا يأكل من النخلة فأكل تمرها ← يحنث.<br><b>المندرجة:</b> الأصل في الكلام الحقيقة · إذا تعذرت الحقيقة يُصار إلى المجاز · إذا تعذر إعمال الكلام يُهمل · المطلق يجري على إطلاقه ما لم يُقيَّد."],
[4,"الموضوع 6","تطبيقات القواعد على المعاملات","<b>«العادة محكّمة»:</b> يجوز للمصرف تقديم خدمات الحسابات الجارية بمقابل أو بدونه، وتمييز بعض العملاء، لجريان العرف ما لم يخالف الشرع.<br><b>«الأمور بمقاصدها»:</b> بيع الهازل لا يترتب عليه أثر · اللقطة بنية الحفظ أمانة لا تُضمن إلا بتعدٍّ، وبنية التملك كالغصب تُضمن مطلقًا.<br><b>«الضرر يزال»:</b> باع ما يسرع إليه الفساد وغاب المشتري ← للبائع الفسخ والبيع لغيره."],
[4,"الموضوع 4","الخراج بالضمان: الحديث والصيغ والمستثنيات","<b>الحديث:</b> عن عائشة أن رجلًا ابتاع غلامًا فاستغلّه ثم وجد به عيبًا فردّه، فقال البائع: قد استغلّ غلامي، فقال صلى الله عليه وسلم: «الخراج بالضمان» (أبو داود).<br><b>صيغ:</b> من ضمن مالًا فله ربحه · الغنم بالغرم · النعمة بقدر النقمة · يُستحق الربح بالمال أو العمل أو الضمان.<br><b>مستثنيات:</b> الغاصب يضمن الغلة المتولدة كنسل الحيوان · البائع يرجع بالمبيع ونمائه المتصل إذا أفلس المشتري."],
[4,"الموضوع 4","الغنم بالغرم: الأدلة والمقاصد","<b>الأدلة:</b> <span class='v'>﴿وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ﴾</span> [النجم: 39] · «اليد العليا خير من اليد السفلى».<br><b>مقاصدها (5):</b> العدالة · تعزيز المسؤولية · تنظيم العلاقات الاقتصادية · توجيه السلوك إلى التفكير في العواقب · توازن المصالح.<br><b>أمثلة:</b> التاجر يتحمل تكاليف الشراء والنقل والخسارة · الشركاء يقتسمون الربح ويتحملون الخسارة."],
[4,"الموضوع 4","الجواز الشرعي ينافي الضمان","<b>المعنى:</b> الفعل الجائز المطابق للضوابط لا يوجب الضمان، فإن كان بتعدٍّ أو تفريط ثبت.<br><b>الدليل:</b> «أرأيت إن جاء رجل يريد أخذ مالي؟ قال: فلا تعطه... أرأيت إن قتلته؟ قال: هو في النار» (مسلم).<br><b>أمثلة:</b> حمّل السيارة المستأجرة الوزن المعتاد فتلفت ← لا يضمن · أُبيح له طعام فأكله ← لا ضمان.<br><b>لا تخلط:</b> «الخراج بالضمان» = من عليه الخسارة فله الغلة."],
[4,"الموضوع 4","أصول فساد البيع","<b>عند ابن رشد (4):</b> تحريم عين المبيع · الربا · الغرر · الشروط المؤدية إليهما أو إلى أحدهما.<br>وأسباب النهي من خارج البيع: الغش، والضرر، ووقت العبادة المستحق.<br><b>أسباب بطلان البيع (5):</b> ما يرجع إلى المبيع · إلى الثمن · إلى المتعاقدين · إلى صفة العقد · إلى الحال التي وقع فيها."],
[4,"الموضوع 4","أين فرّق غير الحنفية بين الفساد والبطلان؟","<b>المالكية:</b> في القراض والمساقاة.<br><b>الشافعية:</b> في الحج، والخلع، والكتابة، والعارية.<br><b>الحنابلة:</b> في الحج، والنكاح، والوكالة، والإجارة، والشركة، والمضاربة، وغيرها.<br><b>أنواع البيوع الفاسدة:</b> أن يكون المبيع مجهولًا، أو الثمن مجهولًا جهالة توجب المنازعة."],
[4,"الموضوع 5","للأكثر حكم الكل","<b>صيغها:</b> الأكثر يقوم مقام الكل · الأكثر ينزل منزلة الكمال · الأقل يتبع الأكثر.<br>قاعدة <b>أغلبية لا كلية</b>: لا تجري في الصلاة والطهارة وقراءة الفاتحة ومقادير الحدود.<br><b>أمثلة:</b> قطع أكثر العروق في الذبح · بيع أرض بذكر ثلاثة حدود · دخول الشجر والبناء في وقف البستان دون الخضروات · مسح الخف بثلاثة أصابع يجزئ (أبو حنيفة).<br><b>وجه التيسير:</b> الأجر على العمل كله وإن أُدّي أكثره."],
[4,"الموضوع 5","الباطل لا يقبل الإجازة: الأدلة والأمثلة","<b>صيغها:</b> الباطل لا تلحقه الإجازة · لا يحتمل الجواز بالإجازة.<br><b>الأدلة:</b> <span class='v'>﴿إِنَّ الْبَاطِلَ كَانَ زَهُوقًا﴾</span> [الإسراء: 81] · ﴿قُلْ جَاءَ الْحَقُّ وَمَا يُبْدِئُ الْبَاطِلُ وَمَا يُعِيدُ﴾ [سبأ: 49] · ﴿وَيُبْطِلَ الْبَاطِلَ﴾ [الأنفال: 8] · إجماع نقله العز بن عبد السلام.<br><b>أمثلة:</b> فضولي باع جنينًا في بطن بقرة غيره ← باطل ولو أجازه المالك · هبة الصغير والمجنون مالَه ← باطلة ولو أجاز بعد البلوغ."],
[4,"الموضوع 5","لا يتم التبرع إلا بالقبض: التفاصيل","<b>الأدلة:</b> أثر أبي بكر: نحل عائشة جادّ عشرين وسقًا، ثم قال عند وفاته: «فلو كنتِ جددتيه واحتزتيه كان لكِ، وإنما هو اليوم مال وارث» (الموطأ) · «لا تجوز الهبة إلا مقبوضة» (ضعيف) · إجماع ابن المنذر · العقل.<br><b>أمثلة:</b> وهب لابنه ومات قبل التسلّم ← للميراث · مات الموهوب له قبل القبض ← لا حق لورثته.<br><b>المستثنى:</b> الوصية.<br><b>مقاصدها:</b> حماية الملكية · تأكيد الإرادة · منع التلاعب · الاستقرار · العدل."],
[4,"الموضوع 5","أنواع الوعد في المعاملات الحديثة","1) <b>الوعد بالبيع (بالتملك):</b> من البائع بإبرام البيع مستقبلًا إذا تحقق شرط.<br>2) <b>الوعد بالرهن:</b> يصير ملزمًا إذا تضرر المرتهن بإخلافه.<br>3) <b>الوعد في التبرع:</b> غير ملزم قضاءً بالإجماع، والوفاء مستحب.<br>4) <b>الوعد في المعاوضة:</b> غير ملزم عند الجمهور، وملزم عند المالكية إذا دخل الموعود في شيء بسببه.<br><b>القواعد:</b> الوعد المجرد لا يكون عقدًا · الوعد إذا دخل الموعود بسببه في شيء لزم قضاءً · الوفاء بالعهد واجب."],
[4,"الموضوع 9","تعريفات المال عند المذاهب","<table><tr><th>المذهب</th><th>المال</th></tr><tr><td>الحنفية</td><td>كل ما يمكن ادخاره لوقت الحاجة</td></tr><tr><td>المالكية</td><td>ما يقع عليه الملك ويستبد به المالك</td></tr><tr><td>الشافعية</td><td>ما كان منتفعًا به</td></tr><tr><td>الحنابلة</td><td>ما فيه منفعة مباحة لغير ضرورة</td></tr></table>المال يشمل <b>الأعيان والمنافع</b>، ولا بد أن يعترف الشرع بقيمته."],
[4,"الموضوع 7","المصالح بحسب العموم والتحقق","<b>بحسب العموم:</b><br>• عامة: لكل الخلق أو أكثرهم.<br>• خاصة: بجماعة معينة أو فرد.<br><b>بحسب التحقق:</b><br>• قطعية: يُقطع بأنها مصلحة أو مفسدة.<br>• ظنية: مبنية على الظن أو غلبته.<br>• <b>موهومة</b>: يتوهمها الإنسان وهي على خلافه، فهي <b>غير معتد بها</b>."],
[4,"الموضوع 8","وسائل حفظ الضروريات الخمس","<b>الدين:</b> الأمر بالمعروف والنهي عن المنكر، وإمامته ورعايته وحمايته.<br><b>النفس:</b> العادات كالأكل والشرب، ويؤجر عليها إن نوى الامتثال. ودليلها ﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ﴾.<br><b>العقل:</b> تعلّم العلم الدافع للجهل والخرافات.<br><b>النسل:</b> تشريع النكاح، ونفقة المولود، وتحريم الزنا ونكاح المتعة.<br><b>المال:</b> الحث على السعي، ومنع التبذير، والمعاملات، وتحريم الغصب والربا."],
[4,"الموضوع 8","مقاصد الاقتصاد الإسلامي بالتفصيل","1) <b>العدالة الاجتماعية:</b> تكافؤ الفرص، والتسعير بضوابط، وتجنب الاحتكار.<br>2) <b>توازن الفرد والجماعة:</b> ﴿وَكَذَٰلِكَ جَعَلْنَاكُمْ أُمَّةً وَسَطًا﴾؛ تنويع مصارف الزكاة، وإعانة الصانع، والملكية المزدوجة.<br>3) <b>الرقابة الذاتية:</b> الإحسان، و«من غش فليس مني».<br>4) <b>عمارة الأرض:</b> المال وسيلة لا غاية.<br>5) <b>القوة الاقتصادية:</b> ﴿وَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ﴾."],
[4,"الموضوع 9","حفظ المال: الوسائل والفساد المالي","<b>وسيلتا الحفظ:</b> حد السارق وعقوبة المحارب والغاصب · إيجاب الضمان على المعتدي.<br><b>إيجادًا:</b> الحث على السعي · رفع منزلة العمل «ما أكل أحد طعامًا قط خيرًا من عمل يده» · إباحة المعاملات العادلة.<br><b>بقاءً:</b> تحريم الربا · حد السرقة · حفظ أموال القُصّر · التراضي · ذم الكنز.<br><b>الفساد المالي (5):</b> البخل · الإسراف · أكل المال بالباطل · الغش · الربا."],
[4,"الموضوع 9","مقاصد الزكاة (6)","1) تحقيق الامتثال لله وشكره.<br>2) تطهير نفس المزكي من الشح والأنانية وعبادة المال.<br>3) تثبيت أصالة الإنفاق والبذل.<br>4) تطهير المال من الآفات والنقصان.<br>5) تحقيق التضامن والتراحم والتواد.<br>6) تنمية المجتمع بترويج المال وعدم كنزه."],
[4,"الموضوع 10","مقاصد الاستهلاك (6)","1) إباحة الطيبات وتحريم الخبائث.<br>2) الاعتدال: تحريم الإسراف والتبذير، كتحريم البخل والتقتير ﴿وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا﴾.<br>3) ترتيب الأولويات: ضروري، فحاجي، فتحسيني.<br>4) الموازنة بين الدخل والإنفاق.<br>5) التعاون والتكافل.<br>6) تحريم الترف.<br><b>لا تخلط:</b> السرف تجاوز <b>الكمّ</b>، والترف تجاوز <b>الكيف</b>."],
[4,"الموضوع 10","أثر المقاصد في المعاملات المعاصرة","1) <b>حل النزاعات:</b> تشريع الخيار.<br>2) <b>العدل:</b> إباحة البيع وتحريم الربا.<br>3) <b>منع الجهالة الفاحشة:</b> بيان تكلفة السلعة في المرابحة.<br>4) <b>منع الغرر:</b> آية الخمر والميسر، والنهي عن بيع الغرر.<br>5) <b>التيسير:</b> الأصل في العقود الحل.<br>6) <b>الرواج:</b> <span class='v'>﴿كَيْ لَا يَكُونَ دُولَةً بَيْنَ الْأَغْنِيَاءِ مِنكُمْ﴾</span> [الحشر: 7]."]
];

const KEY="qawaid-fiqh-mali-cards-v1";
LEVELS.forEach(l=>{l.cards=[];});
C.forEach(c=>{const L=LEVELS[c[0]-1];L.cards.push({id:"L"+c[0]+"-"+(L.cards.length+1),lv:c[0],ch:c[1],t:c[2],b:c[3]});});
LEVELS.forEach(l=>l.total=l.cards.length);
let st={done:{},level:1,order:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.done)st=Object.assign(st,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
let hist=[],cur=null,showFinish=false;
const $=id=>document.getElementById(id);
const lvDone=n=>LEVELS[n-1].cards.filter(c=>st.done[c.id]).length;
const unlocked=n=>true; // كل المستويات مفتوحة
function order(n){let o=st.order[n];const ids=LEVELS[n-1].cards.map(c=>c.id);if(!o||o.length!==ids.length||!ids.every(i=>o.includes(i))){o=ids.slice();st.order[n]=o;}return o;}
function byId(id){for(const l of LEVELS)for(const c of l.cards)if(c.id===id)return c;}
function nextCard(n){return order(n).find(id=>!st.done[id]);}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1700);}
function renderTop(){
 const all=C.length,d=Object.keys(st.done).filter(k=>st.done[k]).length;
 $("tot").textContent=d+" / "+all;$("totBar").style.width=(d/all*100)+"%";
 $("levels").innerHTML=LEVELS.map(l=>{const dn=lvDone(l.n),lk=!unlocked(l.n),full=dn===l.total;
  return `<button class="lv ${l.n===st.level?'on':''} ${lk?'lock':''}" data-n="${l.n}">${full?'<span class="badge">✓</span>':''}<div class="t"><b>${lk?'🔒 ':''}${l.n}</b>${l.name}</div><div class="c">${dn} / ${l.total}</div><div class="mini"><i style="width:${dn/l.total*100}%"></i></div></button>`;}).join("");
 document.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(!unlocked(n)){toast("أكمل المستوى السابق أولًا");return;}st.level=n;showFinish=false;cur=null;hist=[];save();render();});
}
function render(){
 renderTop();const n=st.level,L=LEVELS[n-1];
 if(!cur||byId(cur).lv!==n){cur=nextCard(n)||null;}
 if(showFinish||!cur){
  const last=n===LEVELS.length;
  $("main").innerHTML=`<div class="card"><div class="finish"><div class="e">${last?'🏆':'🎉'}</div><h2>${last?'أتممت المقرر كله!':'أتممت المستوى '+n+': '+L.name}</h2><p>${last?'أنهيت البطاقات المئة كلها. راجع ما شئت من المستويات متى أردت.':'أحسنت! المستوى التالي فيه تعمّق أكثر.'}</p>${last?'':`<button class="btn pri" id="goNext">انتقل إلى المستوى ${n+1}: ${LEVELS[n].name}</button>`}<button class="btn sec" id="review">راجع بطاقات هذا المستوى</button></div></div>`;
  if(!last)$("goNext").onclick=()=>{st.level=n+1;showFinish=false;cur=null;hist=[];save();render();};
  $("review").onclick=()=>{showFinish=false;cur=order(n)[0];hist=[];render();};
  return;}
 const c=byId(cur),o=order(n),i=o.indexOf(cur)+1,left=L.total-lvDone(n),isDone=!!st.done[cur];
 $("main").innerHTML=`<div class="card" id="cardEl"><div class="cin"><div class="meta"><span class="chap">${c.ch}</span><span class="pos">المستوى ${n} · بطاقة ${i} من ${L.total}</span></div>${isDone?'<span class="done-tag">✓ منجزة</span>':''}<h2>${c.t}</h2><div class="body">${c.b}</div>
 <div class="acts"><button class="btn" id="ok">✓ تم، فهمتها</button><button class="btn" id="later">${isDone?'إلغاء تم':'لاحقًا'}</button></div>
 <div class="sub"><button class="link" id="prev" ${hist.length?'':'disabled'}>→ السابقة</button><span>بقي ${left} في هذا المستوى</span></div></div></div>`;
 $("ok").onclick=()=>{st.done[cur]=true;save();hist.push(cur);const nx=nextCard(n);if(!nx){showFinish=true;cur=null;}else{cur=nx;toast("أحسنت ✓");}render();scrollTo({top:0,behavior:"smooth"});};
 $("later").onclick=()=>{if(st.done[cur]){delete st.done[cur];save();toast("أُلغي التعليم");render();return;}
  const o2=order(n);o2.splice(o2.indexOf(cur),1);o2.push(cur);save();hist.push(cur);cur=nextCard(n);if(cur===hist[hist.length-1]&&o2.filter(x=>!st.done[x]).length>1){cur=o2.find(x=>!st.done[x]&&x!==hist[hist.length-1]);}render();};
 $("prev").onclick=()=>{if(hist.length){cur=hist.pop();render();}};
}
function openSheet(){const n=st.level,L=LEVELS[n-1];$("shTitle").textContent="المستوى "+n+": "+L.name;
 $("list").innerHTML=order(n).map((id,k)=>{const c=byId(id);return `<button class="it ${st.done[id]?'d':''} ${id===cur?'cur':''}" data-id="${id}"><span class="s">${st.done[id]?'✓':k+1}</span><span>${c.t}</span></button>`;}).join("");
 document.querySelectorAll(".it").forEach(b=>b.onclick=()=>{if(cur)hist.push(cur);cur=b.dataset.id;showFinish=false;$("sheet").classList.remove("open");render();});
 $("cf").classList.remove("show");$("sheet").classList.add("open");}
$("menuBtn").onclick=openSheet;$("close").onclick=()=>$("sheet").classList.remove("open");
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").classList.remove("open");};
$("reset").onclick=()=>$("cf").classList.add("show");$("cfNo").onclick=()=>$("cf").classList.remove("show");
$("cfYes").onclick=()=>{const n=st.level;LEVELS[n-1].cards.forEach(c=>delete st.done[c.id]);delete st.order[n];
 for(let k=n+1;k<=LEVELS.length;k++){/* لا يُمس تقدّم المستويات الأعلى */}
 cur=null;hist=[];showFinish=false;save();$("sheet").classList.remove("open");toast("أُعيد تعيين المستوى");render();};

/* ===== رابط التقدم: يُكتب التقدم والموضع في الرابط، فيعود الدارس إلى مكانه ولو مُسح حفظ المتصفح ===== */
const PROG=(()=>{const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
 const lvOf=id=>+String(id).split('-')[0].slice(1);
 function enc(){const ids=P.ids(),d=P.done();let s='';for(let i=0;i<ids.length;i+=6){let v=0;for(let j=0;j<6;j++)if(d[ids[i+j]])v|=1<<j;s+=A[v];}
  const c=P.cur();return 'p='+s+'&l='+P.level()+(c?'&c='+c:'');}
 function sync(){try{window.history.replaceState(null,'','#'+enc());}catch(e){}}
 function load(){let start=null;try{const m={};(location.hash||'').replace(/^#/,'').split('&').forEach(kv=>{const i=kv.indexOf('=');if(i>0)m[kv.slice(0,i)]=kv.slice(i+1);});
  if(!m.p)return null;const ids=P.ids(),d=P.done(),before=ids.filter(i=>d[i]).length;let fromLink=0;
  for(let i=0;i<ids.length;i++){const v=A.indexOf(m.p[Math.floor(i/6)]||'A');if(v>=0&&(v>>(i%6))&1){fromLink++;d[ids[i]]=true;}}
  if(fromLink>=before){if(m.c&&ids.includes(m.c)){P.go(lvOf(m.c),m.c);start=m.c;}else if(+m.l>=1&&+m.l<=4)P.go(+m.l,null);}
  P.save();}catch(e){}return start;}
 function copy(){const url=location.href.split('#')[0]+'#'+enc();const ok=()=>toast('نُسخ الرابط ✓ احفظه في المفضلة أو أرسله لنفسك');
  const fb=()=>{const t=document.createElement('textarea');t.value=url;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
   let done=false;try{done=document.execCommand('copy');}catch(e){}t.remove();if(done)ok();else window.prompt('انسخ هذا الرابط واحفظه:',url);};
  try{navigator.clipboard.writeText(url).then(ok,fb);}catch(e){fb();}}
 return {sync,load,copy};})();
const P={ids:()=>LEVELS.flatMap(l=>l.cards.map(c=>c.id)),done:()=>st.done,level:()=>st.level,cur:()=>showFinish?null:cur,go:(l,id)=>{st.level=l;cur=id;showFinish=false;},save};
{const _f=render;render=function(...a){const r=_f.apply(this,a);PROG.sync();return r;};}
document.getElementById('progBtn').onclick=()=>PROG.copy();
PROG.load();
render();
