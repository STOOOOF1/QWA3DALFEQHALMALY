<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبر نفسك — قواعد الفقه المالي ومقاصده</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302f;--teal:#0f5c5a;--teal2:#1b7f7a;--tealL:#e3f1ef;--gold:#b8892f;--goldL:#f7efdc;--rose:#9c3d3d;--roseL:#fbeceb;--ok:#1d7a4a;--okL:#e5f5ec;--gray:#5d6b6a;--line:#cfe0dd;--bg:#f3f7f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:16.5px}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 60px}
.btn{font-family:inherit;border:none;cursor:pointer;border-radius:12px;font-weight:700}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
header.top h1{font-size:20px;font-weight:900;color:var(--teal);line-height:1.3}
header.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--gray)}
header.top a{font-size:13.5px;color:var(--teal2);font-weight:700;text-decoration:none;white-space:nowrap}
.note{background:#f3f5fb;border:1px dashed #c9cfe6;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:14px;line-height:1.7;color:#3d4a7a}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.panel h2{font-size:15px;color:var(--teal);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.panel h2 span{font-size:13px;color:var(--gray);font-weight:500}
.sets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.set{font-family:inherit;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:6px 2px;cursor:pointer;color:var(--ink);text-align:center;line-height:1.3}
.set b{display:block;font-size:15px;color:var(--teal)}
.set small{font-size:11.5px;color:var(--gray)}
.set.on{border-color:var(--teal);background:var(--tealL)}
.set.done{border-color:var(--ok)}
.set.done small{color:var(--ok);font-weight:700}
.status{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.status .row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.bar{height:8px;background:var(--tealL);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--gold));transition:width .3s}
.q{background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(15,92,90,.08);margin-bottom:14px;overflow:hidden;border:1.5px solid transparent;scroll-margin-top:70px}
.q.right{border-color:#9fd3b6}.q.wrong{border-color:#e3b2ae}.q.miss{border-color:#e6cf9c}
.qin{padding:14px 16px 14px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.qn{background:var(--teal);color:#fff;border-radius:8px;padding:2px 10px;font-size:13.5px;font-weight:800}
.tp{background:var(--goldL);color:#7a5a16;border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:700}
.qt{font-size:17.5px;font-weight:700;line-height:1.8;margin-bottom:10px}
.tf{display:inline-block;font-size:12px;font-weight:700;color:var(--gray);background:#eef3f2;border-radius:6px;padding:0 7px;margin-inline-start:6px;vertical-align:middle}
.opts{display:grid;gap:8px}
.op{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;font-family:inherit;font-size:16px;line-height:1.7;background:#f7faf9;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.op .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--teal);margin-top:1px}
.op.sel{border-color:var(--teal);background:var(--tealL)}.op.sel .l{background:var(--teal);color:#fff;border-color:var(--teal)}
.tfo{grid-template-columns:1fr 1fr}.tfo .op{justify-content:center;font-weight:800}
.op.good{border-color:var(--ok);background:var(--okL)}.op.good .l{background:var(--ok);border-color:var(--ok);color:#fff}
.op.bad{border-color:var(--rose);background:var(--roseL)}.op.bad .l{background:var(--rose);border-color:var(--rose);color:#fff}
.locked .op{cursor:default}
.hint{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.hint summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--gold);list-style:none}
.hint summary::-webkit-details-marker{display:none}
.hint p{margin-top:6px;font-size:14.5px;line-height:1.75;background:var(--goldL);border-radius:10px;padding:7px 11px;color:#5e4510}
.qact{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.chk{background:var(--teal);color:#fff;padding:8px 18px;font-size:15px}
.chk:disabled{opacity:.4;cursor:default}
.res{font-size:14.5px;font-weight:700;line-height:1.7}
.res.r{color:var(--ok)}.res.w{color:var(--rose)}.res.m{color:#8a6414}
.res .ca{display:block;font-weight:500;color:var(--ink)}
.res .ca b{color:var(--ok)}
.foot{display:grid;gap:8px;margin-top:6px}
.foot .btn{padding:14px;font-size:17px}
.pri{background:var(--teal);color:#fff}.sec{background:var(--tealL);color:var(--teal)}.gh{background:#fff;color:var(--rose);border:1px solid #e7c9c4!important;font-size:15px!important;padding:10px!important}
.summary{background:#fff;border-radius:18px;padding:18px;text-align:center;margin-bottom:14px;box-shadow:0 4px 16px rgba(15,92,90,.08);display:none;scroll-margin-top:10px}
.summary.show{display:block}
.summary .big{font-size:44px;font-weight:900;color:var(--teal);line-height:1.2}
.summary .big small{font-size:20px;color:var(--gray)}
.summary p{color:var(--gray);margin:4px 0 12px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.chips a{text-decoration:none;font-size:13px;font-weight:800;border-radius:8px;padding:3px 9px}
.chips .w{background:var(--roseL);color:var(--rose)}.chips .m{background:var(--goldL);color:#7a5a16}
.summary .btn{padding:11px 16px;font-size:15px;margin:3px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:520px){.sets{grid-template-columns:repeat(5,1fr)}.set small{font-size:10.5px}.qt{font-size:16.5px}.op{font-size:15.5px}}
</style></head><body>
<div class="wrap">
<header class="top"><h1>اختبر نفسك<small>قواعد الفقه المالي ومقاصده · ٣٠٠ سؤال في ١٥ مجموعة</small></h1><a href="../../">← بوابة المقرر</a></header>
<div class="note">الأسئلة منقولة كما هي من <a href="https://app-exams.com/bank-view.html#dEH1PwmddGnDlEsJHhyUSQ" target="_blank" rel="noopener">بنك الأسئلة</a> المعتمد، والإجابات الصحيحة إجاباته. أما <b>التلميحات</b> فمن إعداد الذكاء الاصطناعي ولم تُدقَّق. اضغط <b>تحقق</b> بعد كل سؤال، أو أجب عن المجموعة كلها ثم اضغط <b>اعرض النتيجة</b>.</div>
<div class="panel"><h2>المجموعات <span id="overall"></span></h2><div class="sets" id="sets"></div></div>
<div class="status"><div class="row"><span id="stTitle"></span><span id="stCount"></span></div><div class="bar"><i id="stBar"></i></div></div>
<div class="summary" id="summary"></div>
<div id="qs"></div>
<div class="foot">
<button class="btn pri" id="finishBtn">اعرض النتيجة</button>
<button class="btn sec" id="nextBtn">المجموعة التالية ←</button>
<button class="btn gh" id="resetBtn">ابدأ هذه المجموعة من جديد</button>
</div>
</div>

<script>
const TOPICS=["مدخل القواعد الفقهية", "قواعد الضمان", "العرف والعادة", "الخراج بالضمان", "قواعد الملك والعقود", "تطبيقات القواعد", "تعريف المقاصد وأقسامها", "الضرورات الخمس", "ضرورة المال وحفظه", "مقاصد المال بأنواعه"];
const Q=[[1,1,"ما هي الفائدة الأساسية من دراسة القواعد الفقهية للمهتمين بالمال والأعمال؟",["تتبع الحيل المحرمة في المعاملات","مخالفة الشروط المقيدة للتجارة","فهم علل الأحكام وضبط النوازل الاقتصادية بضبط شرعي","الاعتماد على الرأي الشخصي في التمويل"],2,"القواعد تجمع العلل وتضبط المستجدات، فابحث عن الخيار الذي يجمع «الفهم» و«الضبط»."],[2,1,"ما المقصود الأبرز لدراسة علم القواعد الفقهية وتطبيقاتها في النشاط الاقتصادي؟",["تغيير الأحكام الشرعية الثابتة بحسب رغبة التجار","ضبط المعاملات المالية المعاصرة بأحكام كلية واضحة","إلغاء العقود القديمة بشكل كامل","الاستغناء عن النصوص الشرعية والاجتهاد المطلق"],1,"القاعدة «كلية»، ووظيفتها الضبط لا الإلغاء ولا التغيير."],[3,1,"تبرز أهمية القواعد الفقهية في الفقه المالي من خلال:",["صعوبة التعامل مع المعاملات المصرفية","تسهيل تطبيق الأحكام الكلية على النوازل الاقتصادية المستجدة","التركيز على الفروع الفقهية الفردية فقط","إيجاد تعارض بين النصوص الاقتصادية"],1,"الأهمية تكون في «التسهيل» لا في الصعوبة أو التعارض."],[4,1,"كيف يسهم علم القواعد الفقهية في إثراء الفقه المالي؟",["بتعقيد إجراءات التعاقد بين الأفراد","بإلغاء الاجتهاد في المعاملات المالية الحديثة","بمنح الباحث القدرة على رد النوازل الاقتصادية لأصولها الصحيحة","باستقلال كل معاملة عن الأخرى بلا ضابط"],2,"فكّر في «ردّ» الجديد إلى أصله."],[5,1,"دراسة قواعد الفقه المالي تهدف إلى إيجاد فوضى تشريعية في العقود المعاصرة.",["صح","خطأ"],1,"هل غاية القواعد الضبط أم الفوضى؟"],[6,1,"تكمن فائدة علم القواعد الفقهية في ضبط الفروع المتفرقة تحت أصل جامع يحكم المعاملات المالية.",["صح","خطأ"],0,"تذكّر معنى «القاعدة الكلية»: أصل يجمع فروعًا."],[7,1,"علم القواعد الفقهية يقتصر دوره على العبادات البحتة ولا علاقة له بالفقه المالي المعاصر.",["صح","خطأ"],1,"المقرر نفسه اسمه «قواعد الفقه المالي»."],[8,1,"ما الأثر العلمي المباشر لمعرفة القواعد الفقهية وفهمها في مجال المعاملات المالية المعاصرة للباحث والفقيه؟",["الاستغناء التام عن نصوص الشريعة والاكتفاء بالعرف التجاري الحديث","إيجاد أحكام متناقضة للمعاملات المالية بحسب رغبة الأسواق المالية","تسهيل استنباط الأحكام للنوازل الاقتصادية المستجدة عبر ردها إلى أصولها الكلية الحاكمة","حصر الاجتهاد المالي في العبادات والابتعاد عن قطاع الأموال والاستثمار"],2,"الأثر المباشر يتعلق بالاستنباط للنوازل."],[9,1,"تكمن الفائدة الكبرى لعلم القواعد الفقهية في ضبط مسائل الفقه المالي وربط الفروع المتناثرة بأصول كلية حاكمة",["صح","خطأ"],0,"الربط بين الفروع والأصول هو جوهر علم القواعد."],[10,1,"تساعد القواعد الفقهية في الفقه المالي على ضبط المعاملات المستجدة وربطها بالأصول الشرعية الكلية.",["صح","خطأ"],0,"«المستجدات» تحتاج أصلًا كليًا تُردّ إليه."],[11,1,"تعتبر القواعد الفقهية إطاراً ناظماً يجمع الفروع المتفرقة تحت أصل واحد يسهل فهمه وتطبيقه.",["صح","خطأ"],0,"«ناظم» = يجمع ويرتّب."],[12,1,"تعريف القواعد الفقهية في اصطلاح الفقهاء يعنى الأحكام الفرعية الجزئية التي لا تنطبق إلا على حادثة واحدة فقط.",["صح","خطأ"],1,"القاعدة «كلية» أم «جزئية»؟"],[13,1,"دور القواعد الفقهية في الفقه المالي يقتصر على سرد الأحكام التاريخية دون أي فائدة في توجيه المعاملات المعاصرة.",["صح","خطأ"],1,"انتبه لكلمة «يقتصر» و«دون أي فائدة»."],[14,1,"كيف يسهم فهم القواعد الكلية في دراسة الاقتصاد الإسلامي ومعاملاته المالية؟",["يعزل الباحث عن التفاصيل الفقهية الدقيقة للجزئيات","يمنح الباحث القدرة على رد الفروع المتناثرة إلى أصولها وضبط المستجدات","يغني عن دراسة النصوص الشرعية الخاصة بالمعاملات التجارية","يجعل الأحكام الاقتصادية قطعية وثابتة بلا اعتبار لتغير الأزمنة"],1,"القواعد لا تُغني عن النصوص؛ ابحث عن «الرد والضبط»."],[15,1,"تعنى القواعد الفقهية في اصطلاح الفقهاء جمع الأحكام الفرعية الجزئية المتناثرة دون الحاجة لربطها بأصل كلي يجمعها.",["صح","خطأ"],1,"جمعٌ بلا أصل كلي لا يسمّى قاعدة."],[16,1,"تساعد معرفة القواعد الفقهية دارس الاقتصاد الإسلامي على فهم علل الأحكام وضبط التصرفات المالية وفق الشرع.",["صح","خطأ"],0,"فهم العلة من أبرز فوائد القواعد."],[17,1,"ما الفائدة الأساسية من دراسة القواعد الفقهية لدارس الاقتصاد الإسلامي والمعاملات المالية؟",["حفظ النصوص الفقهية القديمة دون الحاجة لفهم عللها","تسهيل استنباط الأحكام للنازلات والمعاملات الاقتصادية المستجدة بضبط كلي موحد","الاستغناء التام عن دراسة أصول الفقه ومقاصد الشريعة","إلغاء الأعراف التجارية السائدة في الأسواق المعاصرة"],1,"الخيارات المتطرفة («الاستغناء التام»، «إلغاء») غالبًا خاطئة."],[18,1,"كيف يتم إعمال القواعد الفقهية في استنباط الأحكام للمعاملات المصرفية المعاصرة المستجدة؟",["بتطبيق القاعدة الكلية المناسبة بعد تكييف النازلة ومعرفة مناط الحكم فيها","بإهمال طبيعة العقد المعاصر والبحث عن نص حرفي قديم فقط","باعتماد الأعراف الحديثة مطلقاً بغض النظر عن قواعد الشريعة","بمنع جميع العقود المستجدة احترازاً"],0,"الخطوات: تكييف النازلة ← معرفة المناط ← تنزيل القاعدة."],[19,1,"تعد القواعد الفقهية إطاراً ناظماً يربط المعاملات المالية المستجدة بالأصول العامة لتيسير استنباط الأحكام وضبطها.",["صح","خطأ"],0,"الربط والتيسير والضبط: وظائف القاعدة."],[20,1,"إعمال القواعد الفقهية في استنباط الأحكام للمعاملات المصرفية المستجدة يتم بعزل النص الشرعي عن واقعه المالي.",["صح","خطأ"],1,"الاستنباط الصحيح يربط النص بالواقع لا يعزله."],[21,1,"دراسة قواعد الفقه المالي ومقاصده تهدف إلى إبعاد الشريعة عن مواكبة التطورات الاقتصادية الحديثة",["صح","خطأ"],1,"القواعد أداة للمواكبة لا للإبعاد."],[22,1,"تعتبر القواعد الفقهية أصولاً كلية يُرجع إليها لاستنباط الأحكام الشرعية للوقائع المستجدة في المعاملات المالية",["صح","خطأ"],0,"«أصول كلية يُرجع إليها» وصف دقيق للقاعدة."],[23,1,"تعتبر القواعد الفقهية أدوات منهحية دقيقة يعتمد عليها المجتهد لاستنباط الأحكام الشرعية للنوازل الاقتصادية والمالية المستجدة.",["صح","خطأ"],0,"المجتهد يحتاج أداة منهجية للنوازل."],[24,1,"ما الدور الأساسي للقواعد الفقهية الكبرى في مجال الفقه المالي؟",["تأصيل الأحكام الكلية وجمع النظائر المتفرقة لتسهيل استنباط أحكام المعاملات المستجدة","إلغاء النصوص الشرعية والاعتماد على آراء الأفراد","منع الاجتهاد في النوازل الاقتصادية الحديثة بالكلية","تحديد أسعار السلع في الأسواق العالمية بشكل إلزامي"],0,"«جمع النظائر» من أخص أوصاف القواعد."],[25,1,"كيف يتم إعمال قاعدة الأمور بمقاصدها عند استنباط الحكم الشرعي لتعاملات الصيرفة الإسلامية المعاصرة؟",["بالنظر حصراً إلى الألفاظ والمباني المكتوبة في العقود بغض النظر عن النوايا","بإلغاء العقود تماماً والاعتماد على العرف التجاري البحت","بالتطبيق المباشر لمقاصد العاقدين والمعاني المرادة دون الاكتفاء بالصيغ اللفظية الصورية إذا خالفت الحقيقة","بإثبات الصحة لكل عقد مهما كانت نية المتعاقدين ظالمة"],2,"اسم القاعدة نفسه يدلك: «المقاصد»."],[26,1,"ما هي المنهجية الصحيحة لاستنباط الأحكام الاقتصادية عند تداخل القواعد الفقهية الكبرى وتعارض ظاهرها؟",["إلغاء القواعد الفرعية والتركيز على العرف العام دون ضوابط","الأخذ باللفظ الصريح وإلغاء القصد تماماً في كل المعاملات المعاصرة","الجمع بين المقاصد الشرعية العامة وقواعد الفقه المالي مع إعمال قاعدة المشقة تجلب التيسير في مواطن رفع الحرج بشرط عدم إبطال الحقوق","تجاهل النوازل المالية وعدم البحث عن حلول فقهية لها"],2,"عند التعارض الظاهري: «الجمع» مقدَّم على الإلغاء."],[27,1,"كيف تُعمل قاعدة العبرة للمقاصد والمعاني لا للألفاظ والمباني في استنباط الحكم لعقد التورق المصرفي المنظم؟",["بالنظر إلى القصد الحقيقي للأطراف وهو التمويل النقدي وليس صورة السلع الظاهرة","بالوقوف عند الألفاظ الحرفية للعقود وترك النوايا","بإلغاء العقود إذا احتوت على مصطلحات أجنبية","باختيار اللفظ الأغلى ثمناً بغض النظر عن النتيجة"],0,"ما الذي يريده العميل فعلًا في التورق المنظم: السلعة أم النقد؟"],[28,1,"ما هو الدور الأساسي للقواعد الفقهية في مجال الفقه المالي والمعاملات؟",["تحديد الأسعار الرسمية للسلع في الأسواق المحلية والعالمية","ضبط المعاملات المستجدة وردها إلى الأصول العامة لتحديد الحكم الشرعي لها","منع الأفراد من ممارسة التجارة الحرة بشكل نهائي","إلغاء جميع العقود التقليدية واستبدالها بالقوانين الوضعية"],1,"القاعدة الفقهية تحدد «الحكم» لا «السعر»."],[29,1,"المراد بقواعد الفقه المالي هو مجموعة الأحكام الاقتصادية الوضعيّة التي تحدد أسعار السوق بمعزل عن الضوابط الشرعية.",["صح","خطأ"],1,"كلمة «الوضعية» و«بمعزل عن الشرع» تنافي وصفها بالفقهية."],[30,1,"فهم المقاصد الشرعية يساعد المجتهد في إعمال القواعد الفقهية بصورة صحيحة تلبي حاجات النشاط الاقتصادي وترفع الحرج.",["صح","خطأ"],0,"المقاصد والقواعد يتكاملان."],[31,1,"تعمل القواعد الفقهية في الفقه المالي على ضبط المعاملات المستجدة وردها إلى الأصول العامة للشرع بما يحقق مصالح العباد ويدفع المفاسد.",["صح","خطأ"],0,"جلب المصالح ودرء المفاسد غاية الشريعة كلها."],[32,2,"أي من القواعد التالية تحكم حالة الشخص الذي تسبب في إتلاف مال غيره بطريقة مباشرة دون قصد جنائي؟",["المشقة تجلب التيسير والتخفيف","اليقين لا يزول بالشك المطلق","المباشر ضامن وإن لم يتعدَّ","العادة محكمة في المعاملات"],2,"الكلمة المفتاحية في السؤال: «بطريقة مباشرة»."],[33,2,"الاضطرار في المعاملات المالية يبيح إسقاط حقوق الغير المالية تماماً دون تعويض.",["صح","خطأ"],1,"تذكّر: «الاضطرار لا يبطل حق الغير»."],[34,2,"قاعدة المباشر ضامن وإن لم يتعدَّ تطبق على من أتلف مالاً لغيره بالفعل المباشر بغض النظر عن وجود قصد العدوان",["صح","خطأ"],0,"«وإن لم يتعدَّ» تعني: حتى بلا قصد عدوان."],[35,2,"الأموال تضمن بالخطأ كما تضمن بالعمد استناداً إلى قاعدة لا ضرر ولا ضرار.",["صح","خطأ"],0,"حق المالك لا يضيع لأن المتلف أخطأ."],[36,2,"يحق للشخص أخذ ماله المغتصب بطريقة سرية وخاصة متى ما قدر عليها بناءً على قاعدة الظفر بالحق دون ضوابط.",["صح","خطأ"],1,"انتبه لعبارة «دون ضوابط»."],[37,2,"قاعدة الاضطرار لا يبطل حق الغير توجب حفظ الحقوق المالية لأصحابها حتى في حالات الضرورة.",["صح","خطأ"],0,"الضرورة تبيح الفعل، لكن هل تُسقط الحق؟"],[38,2,"اشترى شخص سلعة وتلفت تحت يده بسبب خطأ غير مقصود منه، فما الحكم الفقهي لضمان هذه السلعة استناداً للقواعد المالية؟",["تسقط القيمة كلياً لعدم وجود قصد التعدي أو الإتلاف","تضمن السلعة لأن الأموال تضمن بالخطأ كما تضمن بالعمد","يضمن نصف القيمة فقط تخفيفاً لحال الخطأ غير المباشر","لا ضمان عليه إلا إذا وُجد شرط صريح بذلك في العقد"],1,"الخطأ والعمد سواء في ضمان المال."],[39,2,"حالة الاضطرار التي تمر بها المنشآت الاقتصادية تبيح لها الانتفاع بملكية الغير لكنها لا تسقط عنه حق الضمان والتعويض",["صح","خطأ"],0,"تبيح الانتفاع ولا تُسقط الضمان."],[40,2,"يجوز للمستأجر أن يجمع بين الأجر المستحق عليه والضمان لعين المستودع في وقت واحد بناءً على القواعد المالية",["صح","خطأ"],1,"تذكّر قاعدة «الأجر والضمان لا يجتمعان»."],[41,2,"شركة تسببت في إتلاف بضاعة لتاجر آخر نتيجة خطأ مهني دون تعمد، فما القاعدة الحاكمة لضمان المال هنا؟",["اليقين لا يزول بالشك","المشقة تجلب التيسير","الأموال تضمن بالخطأ كما تضمن بالعمد","التابع تابع"],2,"السؤال يركّز على «الخطأ دون تعمد»."],[42,2,"إذا قام شخص بالاعتداء المباشر على مال غيره وإتلافه دون قصد التعدي، فما القاعدة الفقهية التي توجب ع د الدين بالنيابة عن المضطر فوراً"],2,"الحاجة لا تمحو الدين."],[50,2,"تسببت آلية عمل بأحد المصانع في إتلاف معدات مجاورة دون قصد العدوان المباشر من العامل، فأي قاعدة فقهية تُطبق لضمان تلك الأضرار؟",["قاعدة الأمور بمقاصدها","قاعدة المشقة تجلب التيسير","قاعدة اليقين لا يزول بالشك","قاعدة المباشر ضامن وإن لم يتعدَ"],3,"الإتلاف وقع بالفعل نفسه وإن غاب قصد العدوان."],[51,2,"يجوز اجتماع الأجر والضمان معاً لشخص واحد في عقد الإجارة المعاصرة دون أي ضوابط أو استثناءات.",["صح","خطأ"],1,"قاعدة الباب تنفي اجتماعهما."],[52,2,"قاعدة المباشر ضامن وإن لم يتعدَ تعني أن من أتلف مال غيره مباشرة يتحمل ضمانه ولو لم يكن متعمدًا أو متعدياً.",["صح","خطأ"],0,"هذا شرح حرفي للقاعدة."],[53,2,"أجرى تاجر عقداً مالياً استحق بموجبه أجراً لقاء عمل معين، فحدث تلف في المال محل العمل دون تفريط منه، فكيف يُعامل استحقاق الأجر مع ضمان التلف استناداً للقواعد المالية؟",["يجتمع الأجر والضمان معاً للمستأجر طالما استلم المال","يسقط الضمان ويثبت الأجر وجوباً للمالك الأصلي فقط","لا يجتمع الأجر والضمان للمعمل لأن الأجر مقابل العمل والضمان مقابل التلف","يثبت الضمان للمتسبب ويجوز أخذ الأجر فوقه كتعويض إضافي"],2,"الأجر مقابل شيء، والضمان مقابل شيء آخر؛ فهل يجتمعان؟"],[54,2,"قام دائن بأخذ حقه من مال مدينه الجاحد دون رضاه ودون اللجوء للقضاء مع توافر شروط معينة، فما التكييف الفقهي لهذه الحالة الاقتصادية؟",["قاعدة الغرر الكثير يفسد العقود","قاعدة الأصل في العقود اللزوم","قاعدة المباشر ضامن وإن لم يتعدَ","قاعدة الظفر بالحق"],3,"أخذُ الحق بنفسه دون قضاء له اسم خاص."],[55,3,"ما المراد الأساسي بقاعدة العادة محكمة في سياق المعاملات المالية والاقتصادية المعاصرة؟",["جعل الأعراف الشخصية الفردية ملزمة لكافة المتعاقدين في السوق المالي","إلغاء التشريعات المنظمة للتجارة والاعتماد كلياً على العرف السائد","اعتبار ما اعتاده الناس واستقر في معاملاتهم مرجعاً لضبط العقود والشروط عند عدم النص","منع التجديد والابتكار في صيغ العقود المالية الحديثة بشكل قطعي"],2,"العرف المعتبر عامٌّ مستقر، ويُرجع إليه «عند عدم النص»."],[56,3,"عند تعامل الشركات بعرف تجاري لم يُذكر صراحة في وثيقة التعاقد، فأي القواعد الفقهية الآتية تضفي عليه الصبغة الملزمة؟",["المعروف عرفاً كالمشروط شرطاً","التابع تابع للمتبوع دائماً","اليقين لا يزول بالشك في العقد","الأمور بمقاصدها ومعانيها"],0,"عرفٌ لم يُكتب، فبأي شيء يُشبَّه؟"],[57,3,"كيف تُطبق قاعدة المعروف عرفاً كالمشروط شرطاً في تقييم الشروط التجاريّة السائدة؟",["تُعتبر الأعراف السائدة ملغاة إن لم تُكتب في العقد","تُؤخذ الأعراف التجارية المعتبرة مجرى الشروط الصريحة ما لمخالفتها الشرع","يُشترط تدوين كل عرف تجاري في عقد رسمي","تُمنع الأعراف التجارية نهائياً في المعاملات الحديثة"],1,"العرف المعتبر يجري مجرى الشرط بقيد واحد مهم."],[58,3,"إذا تعارف التجار على طريقة معينة في قبض الثمن ولم يشترطوها صراحة في العقد، فما الحكم بناءً على قاعدة العادة محكمة؟",["يُلغى العقد لعدم ذكر الشرط صراحة","المعروف عرفاً كالمشروط شرطاً فيعتبر العقد صحيحاً","يُرد الأمر إلى القاضي دون اعتبار للعرف","يُعد العقد باطلًا بطلانًا مطلقًا"],1,"عدم ذكر الشرط لا يُبطل العقد إذا كان معروفًا."],[59,3,"إذا جرى عرف المستثمرين في سوق الأوراق المالية على طريقة معينة في تسوية الصفقات دون اشتراط لفظي، فما الحكم؟",["يُعد العرف ملزماً وكأنه شرط صريح استناداً لقاعدة المعروف عرفاً كالمشروط شرطاً","يبطل التعامل المالي لعدم وجود نص كتابي صريح بين الطرفين","لا عبرة بهذا العرف ويُرد الأمر لاتفاق كل طرف على حدة","يُؤخذ بالعرف فقط إذا وافق الهوى الشخصي للمستثمر المتضرر"],0,"نفس فكرة قبض الثمن، لكن في سوق الأسهم."],[60,3,"تاجران تعاملا بناءً على عرف تجاري عام في الدولة، فما الحكم الشرعي لهذا العرف في تكييف العقود؟",["يُعد العرف باطلًا ما لم يُصاغ بقانون","لا عبرة بالعرف التجاري أمام النصوص الفردية","يُعامل العرف معاملة الشرط المكتوب بناءً على العادة محكمة","يُؤخذ بالعرف إن وافق هوى الطرفين فقط"],2,"العرف العام المعتبر = شرط مكتوب."],[61,3,"كيف تتجلى قاعدة المعروف عرفاً كالمشروط شرطاً في تطبيقات التجارة الإلكترونية المعاصرة؟",["بإسقاط كافة الشروط التجارية والاعتماد على تراضٍ مطلق غير منضبط بضوابط السوق","بمنع التعامل عبر الإنترنت لعدم وجود عرف تجاري قديم مستقر فيها","باكتفاء المشتري بالتحقق الشكلي دون التزام بأعراف المنصة ومحدداتها","باعتبار الشروط المطبوعة والآليات المعتادة في المنصات الرقمية كأنها شروط منصوصة بين الطرفين"],3,"آليات المنصة المعتادة لها حكم الشرط."],[62,3,"شركة تجارية أبرمت عقداً استناداً إلى عرف سائد ومستقر بين التجار يخالف نصاً صريحاً ثابتاً في الشريعة الإسلامية، فكيف تُكيَّف هذه المسألة فقهياً؟",["يُعمل بالعرف التجاري استناداً إلى قاعدة العادة محكمة دون اعتبار للنص","يُخير المتعاقدان بين تطبيق العرف أو تطبيق النص حسب مصلحة الشركة","يُعتبر العرف صحيحاً ويسقط النص لتعارف التجار عليه في المعاملات","يُعد العرف باطلاً ولا تعتبر العادة محكمة إلا فيما وافق الشرع وخلا من المخالفة"],3,"ما شرط اعتبار العرف؟ ألّا يخالف…"],[63,3,"المعروف عرفاً بين التجار يُعتبر كالمشروط بينهم استناداً إلى قاعدة العادة محكمة.",["صح","خطأ"],0,"هذه القاعدة فرع عن «العادة محكمة»."],[64,3,"الأعراف التجارية المخالفة للشريعة الإسلامية تعتبر محكمة ومعتبرة في صياغة العقود.",["صح","خطأ"],1,"العرف الفاسد لا يُحكَّم."],[65,3,"العادة المحكمة تعد من الأدلة التابعة التي تُبنى عليها الأحكام عند عدم النص.",["صح","خطأ"],0,"العرف يُعمل به «عند عدم النص»."],[66,3,"تعتمد قاعدة العادة محكمة على اعتبار ما استقر عليه تعامل الناس في معاملاتهم المالية ما لم يخالف نصاً شرعياً ثابتاً.",["صح","خطأ"],0,"العبارة جمعت الاستقرار وعدم المخالفة."],[67,3,"تدخل قاعدة العادة محكمة تحت القواعد الفقهية الكبرى التي يُرجع إليها في ضبط المعاملات المالية عند عدم وجود النص الخاص.",["صح","خطأ"],0,"«العادة محكمة» من القواعد الخمس الكبرى."],[68,3,"قاعدة إعمال الكلام أولى من إهماله تعني إلغاء الألفاظ الصادرة عن المتعاقدين واعتبارها لغواً.",["صح","خطأ"],1,"اسم القاعدة: «إعمال» أولى من «إهمال»."],[69,3,"تُبنى الأحكام الاقتصادية والمالية على اعتبار العرف العام المعتبر متى لم يخالف نصاً شرعياً قاطعاً.",["صح","خطأ"],0,"العرف «العام المعتبر» بشرطه."],[70,3,"تاجر أبرم عقداً تجارياً مع مستورد محلي ولم ينصّا صراحة على كيفية تحمل رسوم الشحن والتفريغ، فجرى العرف العام في ذلك السوق على تحمل البائع لها. بناءً على قاعدة المعروف عرفاً كالمشروط شرطاً، ما الحكم في هذه الحالة؟",["يُلزم البائع برسوم الشحن لأن العرف الجاري كالشرط الملفوظ.","يُعتبر العقد باختلاف الجهالة ويجب إعادة صياغته.","تُقسم الرسوم مناصفة بين الطرفين بصرف النظر عن العرف.","تُسقط الرسوم نهائياً ولا يتحملها أي من الطرفين."],0,"على من جرى العرف في السوق؟"],[71,3,"المعروف عرفاً كالمشروط شرعاً قاعدة فرعية مندرجة تحت قاعدة إعمال الكلام أولى من إهماله.",["صح","خطأ"],1,"هي فرع عن قاعدة كبرى أخرى تتعلق بالعادة."],[72,3,"إذا اشترى شخص سلعة واشترط أن يتبعها وصف معين أو حق مرفق بها، فدخل هذا الوصف أو الحق تحت حكم التبعية في العقد. أي القواعد الآتية تفسر صحة هذا التعلق وتمنع استقلاله؟",["قاعدة التابع تابع.","قاعدة العادة محكمة.","قاعدة إعمال الكلام أولى من إهماله.","قاعدة اليقين لا يزال بالشك."],0,"كلمة «التبعية» في السؤال هي المفتاح."],[73,3,"تطبيقاً لقاعدة المعروف عرفاً كالمشروط شرطاً في المعاملات التجارية المعاصرة، كيف يتعامل الفقيه مع اشتراط خدمات ما بعد البيع في عقود التوريد؟",["يُعتبر هذا الشرط باطلاً لعدم ذكره بلفظ صريح في صلب وثيقة العقد المكتوبة","يُترك الأمر لاجتهاد المشتري دون اعتبار لما تعارف عليه التجار","يُعد العرف السائد في هذه الخدمات كأنه نص مشروط صراحة بين الطرفين","يُبطل العقد برمته لأن العرف لا يخصص أحكام العقود التجارية"],2,"طبّق نص القاعدة المذكورة في السؤال حرفيًا."],[74,3,"قاعدة إعمال الكلام أولى من إهماله تُطبق في العقود المالية لحمل ألفاظ المتعاقدين على معانٍ مفيدة صحيحة بدلاً من إبطالها.",["صح","خطأ"],0,"الأصل حمل الكلام على فائدة."],[75,3,"تنص قاعدة التابع تابع على أن ما لا يثبت استقلالاً قد يثبت تبعاً لغيره في العقود المالية كالمركوب في بيع الدابة.",["صح","خطأ"],0,"«يُغتفر في التوابع ما لا يُغتفر في غيرها»."],[76,4,"ما المقصود بقاعدة الخراج بالضمان في الفقه المالي؟",["من ملك شيئاً جاز له بيعه حالاً ومستقبلاً","عدم جواز أخذ الأجرة على عقود التبرعات","استحقاق الغلة في مقابل تحمل غرم تلف الأصل","سقوط الضمان بهلاك المبيع قبل التسليم"],2,"الخراج = الغلة، والضمان = تحمّل التلف؛ اربط بينهما."],[77,4,"ما هو الدليل المعنوي الأبرز لقاعدة الخراج بالضمان في المعاملات المالية؟",["العدالة ومنع أكل أموال الناس بالباطل دون مقابل","تحقيق الربح السريع للمؤسسات المالية","إسقاط الديون عن المعسرين","وجوب توثيق العقود بالكتابة"],0,"الغلة بلا تحمّل للتبعة ظلم، فما المعنى المقابل للظلم؟"],[78,4,"أي المعاملات المالية التالية تعكس المعنى الحقيقي لقاعدة الخراج بالضمان في الفقه الإسلامي؟",["من دفع مالاً وجب له الربح دون مشاركة في مخاطر المشروع","من باع شيئاً بقي ضمانه عنده وبعده يحصل على أرباح المشتري","من استلم بضاعة وتكلّف ضمانها كان له غلتها وما تنتجه","منافع الأموال لا ترتبط أبداً بموضوع التلف والهلاك"],2,"ابحث عن خيار يجمع «الضمان» و«الغلة» عند الشخص نفسه."],[79,4,"أي من الخيارات التالية يمثل التطبيق الأوضح لقاعدة الخراج بالضمان في المعاملات المصرفية الإسلامية؟",["استحقاق ربح الاستثمار في المشاركات تبعاً لتحمل الخسارة الفعلية بقدر المشاركة","أخذ الفائدة الثابتة على القرض الربوي","استحقاق الربح في المرابحة دون تحمل أي مخاطر","استحقاق ربح المضاربة في مقابل تحمل خسارة رأس المال للمضارب"],0,"الربح بقدر تحمّل الخسارة… وتذكّر أن المضارب لا يضمن رأس المال."],[80,4,"إذا استوفى المشتري منفعة المبيع مدة ثم تبين استحقاق السلعة للغير (شفعة أو استحقاقاً)، فما حكم ما أداه وما استنفده؟",["يسترده البائع وحده","تهدر الغلة ولا يحوزها أحد","تؤول الغلة لبيت المال مباشرة","المنفعة في مقابل الضمان، فلا يجب رد غلتها للمستحق إلا بتعدٍ"],3,"من كان يضمن السلعة طوال المدة؟"],[81,4,"معنى قاعدة الخراج بالضمان أن منافع المال ونماءه يكون لمن يتحمل تبعة تلفه وضمانه.",["صح","خطأ"],0,"هذا هو التعريف نفسه."],[82,4,"يجوز للممول في عقد المرابحة أن يضمن السلعة للعميل ويشترط أخذ الربح كاملاً دون تحمل أية مخاطر تلف.",["صح","خطأ"],1,"ربح بلا تحمّل مخاطرة يخالف القاعدة."],[83,4,"الخراج هو الغلة والنماء الناتج من الأصل، والضمان هو التبعية في الهلاك والتلف.",["صح","خطأ"],0,"تعريف مفردتي القاعدة."],[84,4,"قاعدة الخراج بالضمان تعتبر أصلاً فقهياً هاماً في تكييف المعاملات الاقتصادية المعاصرة وضبط عقود التمويل.",["صح","خطأ"],0,"عليها تُبنى المشاركات والإجارة والمرابحة."],[85,4,"اشترى شخص آلة مصنع وظهر فيها عيب خفي يوجب الرد، فاستغلها المشتري مدة ثم ردها للعيب، فمن يكون له ناتج استغلال الآلة في تلك المدة طبقاً لقاعدة الخراج بالضمان؟",["البائع الأصلي لأن الأصل في ملكيته","المشتري لأنه كان يتحمل ضمانها وهلاكها لو هلكت","الجهة الرقابية للتصنيع","توزع الغلة مناصفة بين البائع والمشتري"],1,"لو هلكت الآلة عنده قبل الرد، فمن كان سيخسرها؟"],[86,4,"اشترى شخص شاحنة لنقل البضائع، وبعد استخدامها لمدة شهرين ظهر فيها عيب قديم قَبْلَ الشراء أوجب ردها للبائع، فما حكم الغلة (الخراج) المتحصلة من عمل الشاحنة خلال مدة الاستخدام قبل الرد؟",["تكون للبائع وحده؛ لأنه المالك الأصلي للعين قبل العقد","تكون للمشتري؛ لأنه تحمل ضمان الشاحنة وعرضها للتلف طوال مدة حيازتها","تقسم مناصفة بين البائع والمشتري رفعاً للضرر","تذهب لبيت المال لعدم استحقاق الطرفين لها"],1,"هذه هي مسألة الحديث نفسه (الغلام المردود بالعيب)."],[87,4,"قام رجل بشراء سيارة بالتقسيط، وحدث حادث تسبب في هلاك السيارة كلياً بعد قبضها، فمن يتحمل خسارتها استناداً لقواعد الضمان؟",["البائع الممول وحده","شركة التأمين التجاري وحدها","تتحمل الجهة الممولة جزءاً من الخسارة بنسبة الأقساط المتبقية","المشتري المالك للسلعة بالقبض"],3,"التقسيط لا يغيّر انتقال الملك والضمان بالقبض."],[88,4,"شخص استأجر أرضاً زراعية، وفي أثناء مدة الإيجار تلفت المحاصيل بسبب جفاف مفاجئ (آفة سماوية)، فما حكم الأجرة المترتبة عليه؟",["تسقط الأجرة كاملة لتلف الغلة وتحقق الخسارة","تخفض الأجرة بنسبة النصف فقط","تجب الأجرة كاملة لأن المنفعة متوفرة والأرض سلمت للمستأجر سليمة","تأخذ حكم الضمان وتنتقل للبائع الأصلي"],2,"الأجرة مقابل منفعة الأرض، لا مقابل المحصول."],[89,4,"إذا باع شخص سلعة معيبة بيعاً صحيحاً، فإن ربح هذه السلعة قبل الرد يكون للبائع لعدم تمام القبض.",["صح","خطأ"],1,"المشتري قبضها وضمنها، فلمن الغلة؟"],[90,4,"إذا تلفت السلعة عند المشتري بعد تسلمها فإن ضمانها ينتقل إليه، ويكون الخراج (النماء) الحاصل منها له تبعاً لذلك.",["صح","خطأ"],0,"بعد القبض: الضمان والنماء للمشتري."],[91,4,"مضمون قاعدة الخراج بالضمان يقتضي أن استحقاق النماء والغلّة في الأموال مبني على تحمل تبعة الهلاك والتلف.",["صح","خطأ"],0,"النماء «مبني» على الضمان."],[92,4,"إذا هلكت السلعة في يد المشتري قبل القبض نتيجة آفة سماوية، فإن الخراج يعود للبائع والضمان على المشتري مجتمعين.",["صح","خطأ"],1,"القاعدة تجعل الخراج والضمان لشخص واحد لا لشخصين."],[93,4,"مؤسسة تمويل اشترت معدات وأبرمت عقداً لتأجيرها منتهي بالتمليك، واشترطت على المستأجر تحمل الصيانة الأساسية والهيكلية للمعدات إلى جانب الأقساط، كيف يقيم هذا الشرط فقهياً؟",["شرط صحيح موافق لقاعدة الغرم بالغنم تماماً","شرط مستحب لرفع التكلفة عن المؤسسة الممولة","شرط فاسد يخالف مقتضى الإجارة وقاعدة الخراج بالضمان لأن ضمان الأصل على المالك","شرط مباح بحسب الاتفاق الجاري بين الطرفين دون قيد"],2,"في الإجارة: الصيانة الأساسية على من يملك العين؟"],[94,4,"شركة استثمارية دخلت مضاربة بمالها، واشترطت أن تكون الخسارة على رب العمل وحده، بينما الربح بينهما أثلاثاً، ما أثر هذه المعاملة بناءً على القواعد المالية؟",["العقد صحيح والشرط باطل لإلغائه قاعدة الغرم بالغنم","العقد باطل ومخالف لقاعدة الخراج بالضمان لأن الغرم يجب أن يقابل الغنم","العقد صحيح والشرط معتبر لحرية التعاقد التجاري","العقد موقوف حتى يرضى الطرفان بالخسارة المشتركة"],1,"انتبه: الإجابة المعتمدة في البنك تحكم على «العقد» لا على الشرط وحده."],[95,4,"استأجر شخص عقاراً للتجارة، وقبل تسليمه حدث طارئ منع الانتفاع به، فما الحكم الشرعي استناداً إلى مقتضى قاعدة الخراج بالضمان؟",["لا تستحق الأجرة لعدم تحقق المعاوضة والمقابلة بالمنفعـة","تلزم الأجرة كاملة لأن العقد تم صحيحاً","يتحمل المستأجر نصف الأجرة ونصف الضمان","يتحمل المؤجر الخراج والمستأجر الضمان معا"],0,"قارن بمسألة الجفاف: هناك سُلّمت المنفعة، وهنا لم تُسلَّم."],[96,4,"شركة تمويل اشترت بضاعة لعميل وأبرمت عقداً، ثم تلفت البضاعة قبل تسليمها للعميل بسبب عيب في النقل تتحمله الشركة، فما الحكم المترتب على ذلك؟",["يلزم المشتري بدفع باقي الأقساط لأن العقد أبرم","توزع الخسارة مناصفة بين الطرفين","ينفسخ العقد ويرجع الثمن للمشتري لأن الضمان كان على البائع","تنتقل الملكية للعميل حكماً"],2,"التلف «قبل التسليم»: من الضامن؟"],[97,4,"تعتمد قاعدة الخراج بالضمان على فصل منافع المال تماماً عن مسؤولية تلفه وهلاكه.",["صح","خطأ"],1,"القاعدة «تربط» لا «تفصل»."],[98,4,"تعني قاعدة الخراج بالضمان أن منافع المال يمتلكها الشخص بغض النظر عن تحمله لمخاطر تلفه وهلاكه.",["صح","خطأ"],1,"«بغض النظر» تنقض معنى القاعدة."],[99,4,"تقتضي قاعدة الخراج بالضمان أن من استحدث نماءً أو غلة في مال غيره بلا سبب شرعي يضمنه، فلا يستحق شيئاً من النماء إذا كان متعدياً.",["صح","خطأ"],0,"المتعدي لا يُكافأ بتعدّيه."],[100,4,"قاعدة الخراج بالضمان تعني أن من استحق غلة شيء ومنافعه، يلزمه تحمل تبعة تلفه أو غرمنه إذا لم يكن هناك تعدٍّ أو تقصير من الطرف الآخر.",["صح","خطأ"],0,"اقرأ القاعدة بالعكس: الغلة تستلزم الضمان."],[101,4,"يقصد بقاعدة الجواز الشرعي ينافي الضمان أن كل تصرف أذنت به الشريعة مطلقاً يستوجب بالضرورة ضمان التلف ولو وقع بلا تعدٍّ أو تفريط من المستوفي.",["صح","خطأ"],1,"«ينافي» الضمان، فهل «يستوجبه»؟"],[102,4,"تسلم شخص بضاعة على وجه السوم أو العرض ثم تلفت في يده، وعند تطبيق القواعد الفقهية عليها، وُجد أن الخراج بالضمان تنطبق عليها؛ فما المعنى العملي لذلك في المعاملة؟",["أن البضاعة تعتبر هبة لازمة بمجرد قبضها المؤقت","أن العقد الباطل هنا ينقلب إلى بيع صحيح","أن الدين يقضى بمثله دون اعتبار للعين","بأن نماء البضاعة لو حصل لكان له، وعليه ضمانها إن تلفت بغير تعدٍّ مفرط حسب الأحوال"],3,"الخيار الصحيح يذكر الطرفين: النماء والضمان."],[103,4,"استأجر مستثمر مبنى تجارياً وحدث تلف لبعض مرافقه بسبب الاستعمال المعتاد، فلما طالب المالك بالتعويض احتج المستأجر بأن الغرم بالغنم، فكيف تُكيَّف هذه النازلة فقهاً؟",["الخراج بالضمان والغرم بالغنم يوجبان على المستأجر تحمل ضمان التلف الناشئ عن استغلاله ومنفعته","الضمان يسقط عن المستأجر لأن المنفعة مقابل الأجرة فقط","المبنى مضمون على المالك وحده مطلقاً دون المستأجر","الغرم بالغنم يعني أن الخسارة يتحملها المالك دائماً"],0,"جواب البنك هنا: من انتفع بالمرافق يتحمل تلفها الناشئ عن انتفاعه."],[104,4,"اشترى شخص آلة مصنع وظهرت فيها عيب خفي رده بعد استغلالها فترة من الزمن، فاستحق البائع أجر المثل لتلك الفترة بناءً على قاعدة:",["الخراج بالضمان","العقد الباطل لا يقبل الإجازة","لا يتم التبرع إلا بالقبض","للأكثر حكم الكل"],0,"السؤال عن «القاعدة» الحاكمة لمسألة الغلة في الرد بالعيب (وفي البنك تعارض مع س85)."],[105,4,"استوردت شركة بضاعة بحرية فتعرضت لتلف جزئي بفعل عاصفة مفاجئة قبل قبضها من البائع، وعند تطبيق القواعد الفقهية على هذه النازلة، من يتحمل الخسارة بناءً على قاعدة الخراج بالضمان؟",["المشتري وحده لأن العقد قد تم","شركة التأمين وحدها دون الرجوع للبائع","توزع الخسارة مناصفة بغض النظر عن القبض","البائع لأن التلف حصل قبل القبض وتحمل التبعة"],3,"العبرة بالقبض لا بمجرد العقد."],[106,4,"استأجر مستثمر معدات تشغيلية، وحدث عطل فني بسبب عيب خفي في التصنيع أدى لتوقف الإنتاج دون خطأ من المستأجر، فأيهما أدق تطبيقاً لقواعد الضمان؟",["يضمن المستأجر الأجرة كاملة ويتحمل عطل المعدات لأنها في يده","تثبت الأجرة بقدر الانتفع الفعلي ولا ضمان على المستأجر لعدم التعدي","ينفسخ العقد وتلزم المؤجر غرامة إضافية عن أرباح المستقبل","يتحمل المستأجر نصف قيمة إصلاح المعدات لكونها تحت يده"],1,"يد المستأجر يد أمانة، والأجرة مقابل ما انتفع به فعلًا."],[107,4,"قاعدة الغرم بالغنم تفيد أن الغنم (المكسب) لا يوجب الغرم (الخسارة) بحسب القواعد العامة.",["صح","خطأ"],1,"«الباء» في القاعدة تعني المقابلة."],[108,4,"قاعدة الخراج بالضمان تعني أن من استحق نفع شيء أو غلته، لزمه تحمل تبعة تلفه أو غرامه.",["صح","خطأ"],0,"النفع يقابله الغرم."],[109,4,"الجواز الشرعي للمعاملة ينافي ضمان التلف إذا تلفت العين في يد المستوفي بلا تعدٍّ ولا تفريط.",["صح","خطأ"],1,"تنبيه: البنك يعدّ هذه العبارة خاطئة (مع أن س101 توحي بخلافها)، فاحفظ جوابه كما هو."],[110,5,"أي المعاملات الآتية تظهر فيها بوضوح قاعدة تبدل سبب الملك قائم مقام تبدل الذات؟",["شخص يقترض مبلغاً نقدياً من مصرف إسلامي","توقيع وعد غير ملزم بين طرفين تجاريين","دفع ثمن سلعة مقدماً دون تحديد مواصفات","شخص يشتري سلعة لنفسه ثم يهبها لغيره ويقبضها الموهوب له"],3,"ابحث عن خيار تنتقل فيه العين بسببين مختلفين (شراء ثم سبب آخر)."],[111,5,"ما المقصود بقاعدة تبدل سبب الملك قائم مقام تبدل الذات في الفقه المالي؟",["تغير مالك السلعة يوجب تلفها الحتمي","انتقال العين من يد إلى يد بغير عوض","أن تغير السبب الذي ملك به الشخص السلعة يجعلها كأنها ملكت بعقد جديد","وجوب تجديد العقد شهرياً"],2,"تغيّر «السبب» = كأن «الذات» تغيّرت."],[112,5,"ما هو الحكم المستنبط مباشرة من قاعدة للأكثر حكم الكل في المعاملات المالية؟",["بطلان العقد لوجود خطأ يسير في صياغته","وجوب تساوي الأنصبة في الشركة المختلطة","تحريم البيع بالتقسيط كلياً","إعطاء الجزء الأكبر من المبيع حكم الكل في التبعية وأحكام العيب"],3,"«الأكثر» يأخذ حكم «الكل»."],[113,5,"أي من الخيارات الآتية يمثل فهماً صحيحاً لقاعدة تبدل سبب الملك قائم مقام تبدل الذات؟",["اعتبار تغير سبب تملك المال من جهة لأخرى بمنزلة تغير العين ذاتها في تأثيره على الأحكام","ثبات العين المالكة وعدم تغيرها نهائياً","بطلان العقود المالية فوراً عند كل انتقال للملك","جواز استرداد كل هبة دون قيد أو شرط"],0,"الخيار الصحيح يكاد يعيد صياغة اسم القاعدة."],[114,5,"ما هو التكييف الفقهي للوعد الملزم في المؤسسات المالية المعاصرة (كالمرابكة للآمر بالشتري)؟",["هو عقد بيع تنجيزي تام فور التلفظ به","يعد وعداً ملزماً ديانة وقضاءً في صور محددة بشرط الإلزام التنظيمي والمادي","هو هبة مشروطة بالقبض الفوري","لا يترتب عليه أي أثر تكليفي أو وضعي"],1,"الوعد ليس عقدًا تامًا، وليس بلا أثر؛ فهو بين ذلك بقيود."],[115,5,"ما المراد بقاعدة الأمور بمقاصدها عندما تُطبق على التصرفات المالية والمصرفية المعاصرة؟",["أن الألفاظ وحدها هي المعيار بغض النظر عن النية","أن العقود والتصرفات تتبع قصود المتعاقدين ونياتهم الحقيقية المعتبرة","أن قصد البائع ينفرد بالحكم دون المشتري","وجوب الإعلان عن النية قبل كل عقد"],1,"المقاصد = القصود والنيات المعتبرة للطرفين."],[116,5,"قاعدة تبدل سبب الملك قائم مقام تبدل الذات تعني أن تغير جهة الملك كالإرث إلى الشراء يعتبر كالذات الجديدة في الحكم",["صح","خطأ"],0,"الإرث سبب، والشراء سبب آخر."],[117,5,"العقد الباطل في الفقه المالي يصح بلحوق الإجازة اللاحقة من العاقدين",["صح","خطأ"],1,"تذكّر قاعدة «العقد الباطل لا يقبل الإجازة»."],[118,5,"اشترى شخص سلعة بعقد بيع طارئ عليه سبب ملك جديد كالميراث قبل القبض، فأي القواعد الآتية تنطبق على هذا التصرف المالي؟",["العقد الباطل لا يقبل الإجازة","الأمور بمقاصدها المعتبرة","تبدل سبب الملك قائم مقام تبدل الذات","المشقة تجلب التيسير والتخفيف"],2,"«سبب ملك جديد» عبارة تدل على القاعدة."],[119,5,"صدر عقد بيع لمستحضر محرم شرعاً منذ الأصل، فحاول البائع والمشتري إجازته بعد العقد لتصحيحه، فأي القواعد تمنع ذلك بقطع؟",["تبدل سبب الملك قائم مقام تبدل الذات","المشقة تجلب التيسير","هل الوعد عقد؟","العقد الباطل لا يقبل الإجازة"],3,"بيع المحرّم باطل من أصله، فهل تنفعه «الإجازة»؟"],[120,5,"اشترى شخص سلعة بعقد فاسد ثم تصرف فيها لآخِر بيعاً جديداً، فأي القواعد الآتية تفسر الحكم بصحة التصرف الثاني نظراً لتغير الجهة؟",["تبدل سبب الملك قائم مقام تبدل الذات","العقد الباطل لا يقبل الإجازة","للأكثر حكم الكل","هل الوعد عقد؟"],0,"«تغيّر الجهة» = تغيّر سبب الملك."],[121,5,"قاعدة هل الديون تقضى بأمثالها تعني وجوب رد العين المغصوبة بذاتها ولو كانت تالفة تماماً",["صح","خطأ"],1,"القاعدة تتكلم عن «أمثال» الديون لا عن العين ذاتها."],[122,5,"تقتضي قاعدة تبدل سبب الملك قائم مقام تبدل الذات بقاء حكم المال القديم على حاله مهما تغيرت أسباب التملك وتعددت.",["صح","خطأ"],1,"لو بقي الحكم القديم لما كان للقاعدة معنى."],[123,5,"قاعدة إذا زال المانع عاد الممنوع تعني أن المانع الشرعي المؤقت إذا ارتفع استمر الحكم بالمنع والبطلان الدائم للمعاملة",["صح","خطأ"],1,"«عاد الممنوع» أي رجع الحكم الأصلي."],[124,5,"تدل قاعدة تبدل سبب الملك قائم مقام تبدل الذات في المعاملات المالية على أن تغير جهة استحقاق المال أو ملكيته يغير حكم التصرف فيه كمن ملك شيئاً بجهة الإرث ثم باعه.",["صح","خطأ"],0,"مثال الإرث ثم البيع من أمثلة القاعدة."],[125,5,"لا يتم التبرع كالهدبة والهبة إلا بقبض الموهوب له لثبوت الملك ولزومه",["صح","خطأ"],0,"هذا نص القاعدة تقريبًا."],[126,5,"واهبٌ وهب مالاً لآخر ولم يسلمه له حتى مات الواهب، فأراد ورثته استرداد المال بناءً على عدم تمام التبرع، فأي قاعدة استندوا إليها؟",["العقد الباطل يقبل الإجازة","الأمور بمقاصدها","الغرسيّ يفسد العقود","لا يتم التبرع إلا بالقبض"],3,"الهبة لم تُسلَّم، فما الذي نقصها؟"],[127,5,"إذا اقترض شخص مبلغاً من النقود ثم تغيرت قيمتها السوقية نزولاً أو صعوداً بأحكام التضخم، فبأي القواعد الفقهية يُحكم رد القرض عند المذاهب المعتبرة في الديون المثليّة؟",["قاعدة هل الديون تقضى بأمثالها","قاعدة لا يتم التبرع إلا بالقبض","قاعدة العقد الباطل لا يقبل الإجازة","قاعدة هل الوعد عقد؟"],0,"القرض دين، والنقود من المثليات."],[128,5,"قاعدة تبدل سبب الملك قائم مقام تبدل الذات تعني بطلان التصرفات المالية قطعا إذا تغير اسم السلعة دون تغير سبب تملكها الحقيقي.",["صح","خطأ"],1,"القاعدة مدارها «السبب» لا «الاسم»، ولا تقتضي البطلان."],[129,5,"تقتضي قاعدة للأكثر حكم الكل إعطاء الحكم الغالب للأقل بناءً على الاستثناء المحض",["صح","خطأ"],0,"الأقل يتبع الأكثر (والبنك يعدّ العبارة صحيحة)."],[130,5,"أي العبارات التالية تعبر بدقة عن مضمون قاعدة: هل الوعد عقد؟",["إثبات أن الوعد يعد عقداً تاماً وناجزاً في كل الأحوال بلا استثناء","نفي أي صفة شرعية للوعد في المعاملات المالية المعاصرة","جعل الوعد مترادفاً للقبض في عقود التبرعات","بيان مدى ترتب الأحكام الإلزامية للعقود على الوعد المجرد أو الملزم في المعاملات"],3,"القاعدة صيغت سؤالًا «هل…؟»، فهي «تبحث مدى» لا تجزم."],[131,5,"ما القاعدة الفقهية التي تقرر أن الهبة أو الصدقة لا تثبت أحكامها وحق التصرف فيها للموهوب إلا بعد حيازتها وقبضها الفعلي أو الحكمي؟",["لا يتم التبرع إلا بالقبض","تبدل سبب الملك قائم مقام تبدل الذات","هل الديون تقضى بأمثالها","هل الوعد عقد"],0,"الهبة والصدقة من التبرعات."],[132,5,"ما المقصود بقاعدة تبدل سبب الملك قائم مقام تبدل الذات في المعاملات المالية؟",["أن تبدل الذات المادية للعين يوجب بالضرورة بطلان العقد الأصلي","أن تغير سبب تملك العين يعطيها حكم العين الجديدة في بعض الآثار الشرعية","أن الديون تسقط بمجرد تغير اسم الدائن أو المدين","أن العقد الباطل يتحول تلقائياً إلى عقد صحيح"],1,"تغيّر السبب ← حكم عين جديدة."],[133,5,"أي من القواعد الآتية تبحث في مسألة ما إذا كان التزام الشخص بأداء دين أو قرض يرد بالمثل من النقود والمثليات؟",["تبدل سبب الملك قائم مقام تبدل الذات","العقد الباطل لا يقبل الإجازة","هل الوعد عقد","هل الديون تقضى بأمثالها"],3,"«يُرد بالمثل» كلمة مفتاحية."],[134,5,"العقد الباطل في المعاملات المالية يصحح ويقبل الإجازة اللاحقة من المتعاقدين باتفاق الفقهاء.",["صح","خطأ"],1,"الباطل لا يقبل الإجازة."],[135,5,"شركة تساهم في مشروع تجاري بغالبية رأس المال وتتولى إدارته، وعند توزيع الأرباح والخسائر تقرر إعطاء المشروع حكم الكل بناءً على غلبة النشاط، فأي قاعدة تم تطبيقها هنا؟",["لا يتم التبرع إلا بالقبض","تبدل سبب الملك قائم مقام تبدل الذات","هل الوعد عقد؟","للأكثر حكم الكل"],3,"«غالبية» و«حكم الكل»."],[136,5,"اشترى شخص سلعة بثمن مؤجل، ثم أبرم عقداً جديداً حول نفس السلعة ليصبح الثمن حالاً مقابل تخفيض مقداره، فأي قاعدة فقهية تنطبق على هذا التصرف المعاصر؟",["هل الديون تقضى بأمثالها","للأكثر حكم الكل","العقد الباطل لا يقبل الإجازة","تبدل سبب الملك قائم مقام تبدل الذات"],3,"«عقد جديد» على السلعة نفسها = سبب جديد."],[137,5,"قاعدة للأكثر حكم الكل تعني إعطاء الجزء الأكبر من الشيء حكم الكل عند تعذر استيعاب الكل أو لتغليب الأغلب.",["صح","خطأ"],0,"تعريف القاعدة."],[138,5,"الديون في الفقه الإسلامي تقضى بقيمتها السوقية يوم الأداء بغض النظر عن انخفاض القوة الشرعية للنقود في قول جمهور الفقهاء.",["صح","خطأ"],1,"الجمهور: الديون تُقضى «بأمثالها» لا بقيمتها."],[139,5,"يقصد بقاعدة هل الوعد عقد؟ أن جميع الوعود التنفيذية في المعاملات المالية المعاصرة ملزمة ديانة وقضاءً على الواعد بشكل مطلق ودون أي قيود شرطية.",["صح","خطأ"],1,"«جميع» و«مطلق» و«دون أي قيود» إشارات تعميم."],[140,5,"تعتمد قاعدة هل الديون تقضى بأمثالها في التطبيقات المعاصرة على رد الديون النقدية بقيمتها الشرائية الفعلية يوم الأداء بصرف النظر عن التغير الفاحش في القوة الشرعية للعملة.",["صح","خطأ"],1,"اسم القاعدة «بأمثالها» لا «بقيمتها»."],[141,5,"قاعدة للأكثر حكم الكل تطبق في العديد من المعاملات المالية المعاصرة عندما يغلب وصف معين على المعاملة فيأخذ حكم الغالب.",["صح","خطأ"],0,"«حكم الغالب» هو معنى القاعدة."],[142,5,"قاعدة لا يتم التبرع إلا بالقبض، تعني أن الواهب يملك الرجوع في هبته المطلقة متى شاء، حتى بعد تسليمها وحيازتها حيازة تامة من قبل الموهوب له.",["صح","خطأ"],1,"بعد القبض يتم التبرع ويلزم."],[143,5,"قاعدة العقد الباطل لا يقبل الإجازة تفيد أن العقود المفقودة لأحد أركانها أو شروط انعقادها الأساسية لا تصححها إجازة المتعاقدين اللاحقة، بخلاف العقد الفاسد.",["صح","خطأ"],0,"فرّق بين الباطل (خلل في الركن) والفاسد (خلل في الوصف)."],[144,6,"ما القاعدة الفقهية الكبرى التي ينبني عليها اعتبار نيات المتعاقدين وقصودهم في العقود المالية؟",["اليقين لا يزول بالشك","الأمور بمقاصدها","المشقة تجلب التيسير","لا ضرر ولا ضرار"],1,"النيات = المقاصد."],[145,6,"ما القاعدة الكبرى التي تُعد أساساً لدفع الحرج والتخفيف عن المكلفين في المعاملات المالية عند وجود الضيق والشدة؟",["العادة محكمة","الخراج بالضمان","المشقة تجلب التيسير","التابع تابع"],2,"الضيق والشدة = مشقة، والتخفيف = تيسير."],[146,6,"العبرة في العقود المالية دائماً للألفاظ المبنية بغض النظر عن نيات المتعاقدين وقصودهم الحقيقية.",["صح","خطأ"],1,"«العبرة للمقاصد والمعاني لا للألفاظ والمباني»."],[147,6,"إذا شك شخص في بقاء دين عليه بعد أن سدده وظن أنه بريء الذمة، فما القاعدة المعتمدة شرعاً في ماله؟",["الشك يوجب الاحتياط دائماً بدفع المال مرة أخرى","الأصل اشتغال الذمة حتى يثبت السداد ببينة قطعية","يُلغى الدين والمال بالمطلق بناءً على الوهم","اليقين لا يزول بالشك وبراءة الذمة هي الأصل"],3,"ما الأصل في الذمة: الشغل أم البراءة؟ (وفق جواب البنك)"],[148,6,"اشترى شخص سلعة يعلم وجود عيب يسير فيها لم يُشترط براءةُ البائع منه، فما الحكم بناءً على القواعد الفقهية؟",["يحق له رد السلعة واسترداد الثمن كاملاً دون قيد","يبطل العقد من أساسه لوجود أي عيب مهما كان صغيراً","يجب على البائع دفع تعويض إضافي للمشتري","الغرَر الكثير فقط هو الذي يفسد العقد أما اليسير فيغتفر ولا يفسده"],3,"العيب «يسير» والمشتري «يعلم» به."],[149,6,"تاجر تسببت شاحنته في إتلاف بضاعة بغير قصد التعدي المباشر، فما الحكم المالي المترتب على ذلك استناداً لقواعد الضمان؟",["لا ضمان عليه لعدم وجود قصد جنائي متعمد","الأموال تضمن بالخطأ كما تضمن بالعمد والمباشر ضامن وإن لم يتعدَ","يتحمل نصف القيمة فقط لأن الخطأ لم يكن مقصوداً","يتحمل متجر التأمين وحده كامل الخسارة دون المالك"],1,"تذكّر قاعدتي الضمان في «القاعدة الثالثة»."],[150,6,"إذا وُجد مانع شرعي أو قانوني يحول دون تنفيذ التزام مالي معين، فإنه إذا زال هذا المانع يعود الممنوع إلى حالته الأصلية وتعود الأحكام المتعلقة به.",["صح","خطأ"],0,"«إذا زال المانع عاد الممنوع»."],[151,6,"أبرم شخص عقداً مالياً بقصد التحايل على الربا وإخفائه بصورة بيع شكلي، كيف يتعامل الفقه المالي مع هذا التصرف استناداً لقاعدة الأمور بمقاصدها؟",["يُعتبر عقداً صحيحاً لمجرد استيفائه الألفاظ الشكلية","يُعمل بالألفاظ الظاهرة ويُهمل القصد الباطن كلياً","يترك الأمر لرغبة الطرفين في الاستمرار أو الإلغاء","تُراعى المقاصد والمعاني لا الألفاظ والمباني ويُحكم ببطلانه باعتباره عقداً ربوياً"],3,"الصورة بيع، والحقيقة ربا؛ فبأيهما العبرة؟"],[152,6,"عند تطبيق القواعد الفقهية على معاملة تمويلية معاصرة تشتمل على غرر يسير محتمل، ما الحكم المستند لقاعدة المشقة تجلب التيسير؟",["يبطل العقد فوراً لوجود أي قدر من الغرر مهما قل","يتحول العقد من عقد مالي معاوضة إلى عقد تبرع إجباري","يلتزم الطرفان بفسخ العقد وإعادة رأس المال بلا أرباح","الغرر الكثير يفسد العقود دون يسيره المحتاج إليه للتيسير"],3,"الغرر «يسير»؛ فرّق بين الكثير واليسير."],[153,6,"الأصل في العقود المالية غير اللازمة هو اللزوم وعدم جواز فسخها بأي حال من الأحوال.",["صح","خطأ"],1,"العبارة تناقض نفسها: «غير اللازمة» أصلها اللزوم؟"],[154,6,"الاضطرار المالي الطارئ على الشخص يبطل حقوق الآخرين المالية ويسقطها تماماً دون تعويض.",["صح","خطأ"],1,"«الاضطرار لا يبطل حق الغير»."],[155,6,"الأصل في العقود المالية والشروط بين المتعاقدين هو الحل والاباحة ما لم يرد نص بتحريمها.",["صح","خطأ"],0,"الأصل في المعاملات الإباحة."],[156,6,"عند تطبيق قاعدة إذا زال المانع عاد الممنوع على المعاملات المالية المعاصرة، أي الحالات الآتية تُعد تطبيقاً صحيحاً لها؟",["بقاء عقد الإجارة باطلاً رغم زوال سبب البطلان تماماً","منع المشتري من الانتفاع بالسلعة بالرغم من تسلمها وارتفاع الحظر عنها","عودة جواز التصرف في السلعة المرهونة بعد سداد الدين وزوال مانع الرهن","بطلان التبرع بالكلية رغم حصول القبض واستيفاء الشروط"],2,"ابحث عن مانع زال فعاد الحكم الأصلي."],[157,6,"عند تطبيق القواعد الفقهية على عقد الاستصناع المعاصر، وُجد أن فيه غرراً يسيراً لا يمكن التحرز عنه إلا بمشقة بالغة، فأي قاعدة تسوغ صحة العقد؟",["العقد الباطل يقبل الإجازة","الديون لا تقضى بأمثالها","الغرر الكثير يفسد العقود دون يسيره","تبدل الذات قائم مقام تبدل السبب"],2,"«غرر يسير» يتكرر كمفتاح."],[158,6,"عند دراسة التكييف الفقهي للبطاقات الائتمانية المعاصرة، كيف تستنبط الأحكام من قاعدة الأمور بمقاصدها وقاعدة المشقة تجلب التيسير معاً؟",["بالنظر إلى قصد الحامل والمصدر والرسوم المترتبة مع مراعاة رفع حرج التعامل المصرفي المعاصر دون الوقوع في الربا المحرم","بإباحة كافة الفوائد الربوية بحجة وجود مشقة في السفر والدفع","باعتبار كل بطاقة ائتمانية عقداً باطلاً مطلقاً لعدم وجود نص تفصيلي قديم","بالتركيز على ألفاظ العقد المكتوبة بخط صغير وإهمال مقصد المعاملة المالي تماماً"],0,"الخيار الصحيح يجمع القاعدتين معًا: القصد + رفع الحرج."],[159,6,"يُعد إعمال قاعدة المشقة تجلب التيسير في المعاملات المالية المعاصرة مسوغاً لرفع الحرج الاستثنائي من خلال إباحة الغرر الكثير والفاحش مطلقاً.",["صح","خطأ"],1,"التيسير لا يبيح الغرر «الفاحش»."],[160,6,"تعني قاعدة الغرر الكثير يفسد العقود دون يسيره في المعاملات الاقتصادية أن الغرر الفاحش والمؤثر يُغتفر دائماً ولا أثر له على صحة العقد المالي.",["صح","خطأ"],1,"العبارة قلبت معنى القاعدة."],[161,6,"إعمال القواعد الفقهية في المعاملات المالية المعاصرة يسهم في ضبط النوازل الاقتصادية وإيجاد الحلول الشرعية لها",["صح","خطأ"],0,"ضبط النوازل من فوائد القواعد."],[162,6,"الوعد الملزم ديانةً وقضاءً في جميع الأحوال يعد عقداً تاماً تترتب عليه كافة آثار البيع والشراء الفورية",["صح","خطأ"],1,"الوعد ليس عقدًا تامًا «في جميع الأحوال»."],[163,6,"في المعاملات التجارية المعاصرة، يجوز اشتراط أخذ الربح كاملاً مع إعفاء المستثمر من أي تحمل للخسارة المحتملة في رؤوس الأموال.",["صح","خطأ"],1,"«الغرم بالغنم»."],[164,6,"عند تطبيق القواعد الفقهية على عقود التمويل المعاصرة، كيف تُكيّف غرامات التأخير غير المشروعة في الديون؟",["تُقَبَل مطلقاً لأنها تعوض المؤسسة عن التضخم المالي","تُمنع لأنها تدخل في باب الربا المحرم بزيادة الدين مقابل الزمن","تعتبر من باب الخراج بالضمان للممول","تُصنف كأتعاب إدارية بحتة لا غبار عليها"],1,"زيادة في الدين مقابل التأخير = ؟"],[165,6,"في معاملة إجارة منتهية بالتمليك، اشترط المجدد في العقد أن صيانة الأصول التشغيلية الجسيمة تقع على عاتق المستأجر وحده، فكيف تُكيَّف هذه المسألة فقهياً؟",["الشرط صحيح وموافق لقاعدة الخراج بالضمان تماماً","يُلغي العقد بطلاناً تاماً ولا يصح أصله","تنتقل الملكية فوراً للمستأجر","الشرط مخالف لمقتضى العقد وقاعدة الخراج بالضمان لأن ضمان الأصل على المؤجر"],3,"في الإجارة: المالك يضمن الأصل."],[166,6,"عقود المعاوضات المالية المعاصرة لا تأخذ بأحكام القواعد الفقهية الكلية لكونها مستحدثة بالكامل.",["صح","خطأ"],1,"القواعد وُضعت أصلًا لاستيعاب المستجدات."],[167,6,"عند تطبيق القواعد الفقهية على بطاقات الائتمان المتجددة، إذا اشترط المصرف غرامة تأخير مالية تُضاف لصصالحه نظير التأخير في السداد، فما التكييف المعياري لهذه الغرامة؟",["جائزة لأنها تعويض عن ضرر تفويت المال","مباحة بمقتضى قاعدة الخراج بالضمان","تعتبر من باب الأجرة الفعلية للخدمة","ممنوعة لأنها تشبه ربا الجاهلية وتخالف قواعد التبرعات والضمان"],3,"«تُضاف لصالحه» مقابل التأخير: ما اسم هذه الزيادة؟"],[168,6,"تطبيقات القواعد الفقهية في المعاملات المالية تهدف إلى إيجاد الحلول البديلة للتعاملات الربوية وحماية الأطراف من الغرر والظلم.",["صح","خطأ"],0,"البدائل الشرعية والحماية من الظلم هدفان صحيحان."],[169,6,"عند دراسة النوازل المتعلقة بالشركات الاستثمارية المعاصرة، كيف يُكيّف الفقهاء عقود المشاركات الحديثة التي تختلط فيها الأنشطة المباحة والمحرمة؟",["بتطبيق قاعدة الغرم بالغنم وقواعد التطهير للأجزاء المحرمة بحسب الغلبة","بإلغاء المعاملة كلياً دون النظر لتفاصيل النسب","باعتبار العقد صحيحاً مطلقاً دون أي قيود","بتحويل العقد إلى قرض ربوي مباشر"],0,"الشركات المختلطة: تطهير + اعتبار الغلبة."],[170,6,"عند تطبيق القواعد الفقهية الكبرى على عقود المعاملات المالية المعاصرة، ما هو الهدف الأساسي من إنزال هذه القواعد على المستجدات؟",["تسهيل التهرب من الالتزامات المالية للمتعاقدين","إلغاء الأعراف التجارية الحديثة بشكل كامل","الاستغناء عن النصوص الفقهية التفصيلية تماماً","إيجاد التكييف الشرعي الضابط للممارسات الاقتصادية المستجدة"],3,"كلمة «التكييف» تتكرر في أجوبة هذا الموضوع."],[171,6,"تتمثل أهمية إعمال القواعد الفقهية على المستجدات الاقتصادية في تأصيل المعاملات ومعرفة أحكامها بدقة ويسر.",["صح","خطأ"],0,"التأصيل والتيسير معًا."],[172,6,"تطبيقات القواعد الفقهية على البطاقات الائتمانية المعاصرة تعتمد كلياً على أحكام الهبة المطلقة بلا قيود.",["صح","خطأ"],1,"«كليًا» و«بلا قيود» تعميم غير دقيق."],[173,6,"تطبيق القواعد الفقهية على المستجدات الاقتصادية يهدف إلى إيجاد التكييف الشرعي الصحيح وضبط المعاملات بما يحقق مقاصد الشريعة.",["صح","خطأ"],0,"التكييف والضبط وتحقيق المقاصد."],[174,6,"تطبيقات القواعد الفقهية على البطاقات الائتمانية غير الإسلامية تستوجب تكييف الرسوم المترتبة على التأخير وفق قواعد الربا والديون.",["صح","خطأ"],0,"رسوم التأخير تُبحث في باب الربا والديون."],[175,6,"عند النظر في الصناديق الاستثمارية المختلطة التي تتعامل بالحلل والحرام، وتطبيق القواعد الفقهية عليها لتحديد حكم التخلص من الكسب المحرم، فأي القواعد الآتية هي الأنسب للتطبيق المباشر؟",["قاعدة تبدل سبب الملك قائم مقام تبدل الذات لتحليل الربح المحرم","قاعدة هل الوعد عقد لإبطال مساهمة الشركاء","قاعدة للأكثر حكم الكل إذا غلب الحلال، مع وجوب تطهير القدر الحرام استناداً لقواعد أخرى","قاعدة لا يتم التبرع إلا بالقبض لتوزيع الأرباح"],2,"«مختلطة» و«غلبة» تدلك على قاعدة الأكثر."],[176,6,"شركة استثمارية معاصرة أبرمت عقداً يشوبه جهالة مفضية إلى النزاع، فأرادت تكييفه بناءً على القواعد الفقهية، فما الحكم الأطبق على هذا العقد الفاسد في أثره الضماني؟",["فاسد العقود لا يترتب عليه أي أثر ضماني مطلقاً","فاسد العقود ينقلب إلى تبرع صحيح بمجرد القبض","فاسد العقود يسقط الضمان فيه ويبقى النفع للآخذ بلا عوض","فاسد العقود كصحيحها في وجوب الضمان عند الاستيفاء والتلف"],3,"قاعدة: «فاسد كل عقد كصحيحه في الضمان»."],[177,6,"في صيغة التمويل الملزم بالوعد (الوعد الملزم في مرابحة الآمر بالشراء)، إذا أريد تطبيق قاعدة هل الوعد عقد على المستجدات المصرفية، فأي العبارات الآتية تمثل التطبيق الفقهي الأدق؟",["الوعد لا يبرم به أي التزام شرعي مالي تحت أي ظرف","يُنزَّل الوعد الملزم من المؤسسة منزلة العقد الفعلي إذا ترتب عليه التزام طرف آخر ودخل في كلفته","الوعد يغني عن القبض في عقود التبرعات دون المعاوضات","الوعد الملزم يعتبر عقداً تاماً بمجرد التلفظ به قبل الإيجاب والقبول"],1,"الوعد يُلزم إذا أدخل الموعود في كلفة؛ ابحث عن هذا القيد."],[178,6,"إنزال القواعد الفقهية على المستجدات الاقتصادية يسهم بضبط العقود المركبة المعاصرة ويمنع الوقوع في المحظورات الشرعية كالربا والغرر الفاحش.",["صح","خطأ"],0,"الضبط ومنع المحظور: فائدتان صحيحتان."],[179,7,"ما المقصود الأساسي لمصطلح مقاصد الشريعة في باب المعاملات المالية؟",["مجموعة الأرقام الاقتصادية المحسوبة لتقييم النمو السنوي فقط.","الأعراف المستقرة بين التجار في الأسواق المالية دون استناد لنصوص.","الغايات والأسرار التي شرعها الله تعالى لتحقيق مصالح العباد في أموالهم.","الوسائل الإجرائية البحتة المتبعة في البنوك التقليدية."],2,"المقاصد = الغايات والحِكَم."],[180,7,"ما هو التقسيم الأساسي للمقاصد الشرعية باعتبار رتبتها وقوتها في حفظ المصالح؟",["ضرورية، وحاجية، وتحسينية","عامة، وخاصة، وجزئية","ثابتة، ومتغيرة، ومؤقتة","مالية، وبدنية، واجتماعية"],0,"التقسيم بحسب «الرتبة والقوة» تنازليًا."],[181,7,"أي مما يلي يُعد من أبرز أهداف دراسة مقاصد الشريعة في المعاملات المالية؟",["إيجاد حيل فقهية لتجاوز القيود الشرعية في العقود التجارية المعاصرة","إدراك الحِكم والمصالح التي شرع من أجلها الأحكام المالية وحماية أموال الناس","تعطيل النصوص الشرعية الخاصة بالبيوع عند حدوث أزمات اقتصادية","إلغاء دور العرف التجاري تماماً في تفسير العقود والالتزامات المالية"],1,"المقاصد تُدرك الحِكَم لا تبحث عن الحيل."],[182,7,"ما هو المقصود بمقاصد الشريعة الإسلامية في المعاملات المالية؟",["الأدلة التفصيلية لاستخراج الأحكام الفقهية المتعلقة بالبيع والشراء","الغاية والمعاني والحكم التي شرعها الله تعالى لتحقيق مصالح العباد في المال","القواعد الفقهية الخاصة بتوزيع المواريث بين الورثة","الوسائل المستخدمة في تحصيل الأموال بطرق غير مشروعة"],1,"قريب من سؤال 179: غايات + حِكم + مصالح."],[183,7,"تنحصر أهمية دراسة المقاصد الشرعية في استخراج الأحكام الفقهية المتعلقة بالعبادات وحدها دون المعاملات المالية.",["صح","خطأ"],1,"المقرر كله عن مقاصد المال."],[184,7,"تُعرف المقاصد الضرورية في المعاملات المالية بأنها التي لا غنى عنها في استقامة مصالح الدين والدنيا بل تبلغ حد الحجيج والتحسين فقط.",["صح","خطأ"],1,"الضروري فوق الحاجي والتحسيني لا في حدّهما."],[185,7,"كيف تسهم معرفة مقاصد الشريعة في الاجتهاد الفقهي المالي المعاصر؟",["من خلال إلغاء النصوص الشرعية عند وجود تعارض مع المصلحة الاقتصادية","بفهم علل الأحكام وربط النوازل المستجدة بمقاصد الشريعة العامة والخاصة","بالاقتصار على النقل الحرفي للمذاهب الفقهية دون النظر إلى مآلات الأفعال","عن طريق إقرار جميع المعاملات المصرفية بغض النظر عن مصادر تمويلها"],1,"الفهم والربط، لا الإلغاء ولا الجمود."],[186,7,"أي من الخيارات الآتية يمثل فهماً دقيقاً لحقيقة المصالح والمفاسد في المعاملات المالية؟",["المصالح تحددها المؤسسات الاقتصادية الدولية بغض النظر عن المقاصد الشرعية","المفاسد تقتصر على الأضرار البدنية ولا علاقة لها بالخسائر المالية","المصلحة هي كل ما يحقق ربحاً مادياً ولو صاحبه أكل أموال الناس بالباطل","المصالح هي ما جلبت منفعة محضة ودفعَت مفسدة خالصة مع مراعاة المآلات الشرعية"],3,"المصلحة الشرعية تُقاس بميزان الشرع ومآلاته."],[187,7,"كيف يساهم إدراك المقاصد العامة للشريعة في ترشيد القرارات الاستثمارية المعاصرة؟",["عبر الالتزام المطلق بالأعراف التجارية السائدة بغض النظر عن مآلاتها.","بالتركيز الحصري على تعظيم الأرباح قصيرة الأجل بغض النظر عن المصالح.","من خلال توجيه الموارد نحو الأنشطة التي تحقق النفع العام وتدفع الضرر.","من خلال إلغاء العقود المستجدة والاعتماد على العقود التقليدية فقط."],2,"«الترشيد» = توجيه نحو النفع."],[188,7,"إذا تعارضت مصلحتان متفاوتتان في المرتبة، كأن تتعارض مصلحة ضرورية مع مصلحة تحسينية في التمويل الإسلامي، فما القاعدة المقاصدية المتبعة؟",["تُقدم المصلحة التحسينية لشمولها وتزينها للعقود المالية","تُقدم المصلحة الضرورية لحفظ الكليات الخمس ومنها المال","يتسويان ويُخير المكلف بينهما بحسب رغبته التجارية","تُلغى المصلحتان معاً لتعذّر الجمع بينهما في العقد الواحد"],1,"الأعلى رتبة يُقدَّم."],[189,7,"المقاصد التحسينية في المعاملات المالية توازي المقاصد الضرورية في مرتبة الحفظ والأهمية لاستقامة الحياة الاقتصادية.",["صح","خطأ"],1,"هل الرتب الثلاث متساوية؟"],[190,7,"يمكن اهتمام الشريعة بالمقاصد التحسينية على حساب إلغاء المصالح الضرورية عند تعارضهما في المعاملات.",["صح","خطأ"],1,"الأدنى لا يُقدَّم على الأعلى."],[191,7,"تُعد معرفة مقاصد الشريعة أداة رئيسية تمكن المجتهد من تنزيل الأحكام الشرعية على النوازل الاقتصادية المعاصرة بدقة.",["صح","خطأ"],0,"المقاصد من أدوات الاجتهاد."],[192,7,"تعد معرفة مقاصد الشريعة أداة أساسية للمجتهد لترجيح الأحكام ومعرفة أسرار التشريع الحكيم في المعاملات المالية.",["صح","خطأ"],0,"الترجيح ومعرفة الأسرار من فوائد المقاصد."],[193,7,"عند النظر في مآلات الأفعال الاقتصادية لمعرفة أحكامها، أي المعايير الآتية يعتمد عليها المجتهد لتحديد الحكم الشرعي بدقة؟",["الاعتماد على رغبات المتعاقدين الفردية بصرف النظر عن الآثار الاجتماعية.","موازنة المصالح المعتبرة والمفاسد المتوقعة وفق مراتبها الشرعية المقررة.","تقديم جلب المصلحة التحسينية مطلقاً على دفع المفسدة الضرورية.","الأخذ بالعرف الخاص وإن خالصه نص قطعي الثبوت والدلالة."],1,"النظر في المآل = «موازنة»."],[194,7,"كيف يظهر أثر فهم المقاصد الشرعية في تقييم عقود المعاملات المالية المعاصرة المستجدة؟",["بالتطبیق الحرفي للصور الفقهية القديمة دون اعتبار للتغيرات الاقتصادية الحديثة","بإباحة كافة العقود المستحدثة طالما أنها تقبلها الأسواق المالية العالمية","باعتماد الجانب اللفظي للعقود وتجاهل النوايا والمقاصد الأصلية للمتعاقدين","بالنظر إلى مآلات العقود وشروطها ومدى تحقيقها لحفظ الأموال ومنع الغرر والربا"],3,"المآلات + حفظ الأموال."],[195,7,"عند تعارض مصلحة حاجية مع مفسدة ضرورية في مجال المعاملات المالية، كيف يُتصور التعامل مع هذا التعارض وفق القواعد الأصولية والمقاصدية؟",["تُقدم المصلحة الحاجية لأنها أسهل في التحقيق وأقرب للتيسير على المكلفين","يُلغى الاعتبار للمصلحتين معاً دفعاً للحرج المتوقع في السوق المالي","تُدرأ المفسدة الضرورية ولو تفوّت المصلحة الحاجية؛ لأن درء المفاسد مقدم على جلب المصالح","تُرتكب المفسدة الحاجية لتحصيل المصلحة الحاجية المطلوبة دون تردد"],2,"«درء المفاسد مقدم على جلب المصالح»."],[196,7,"المقاصد الضرورية في الأموال تُعنى بالأمور التزيينية والتحسينية التي لا تأثير لها على استقرار الاقتصاد.",["صح","خطأ"],1,"العبارة وصفت التحسيني لا الضروري."],[197,7,"تقسيم المقاصد إلى ضرورية وحاجية وتحسينية يُلغي تماماً اعتبار جلب المصالح في المعاملات المالية ويقتصر على درء المفاسد فقط.",["صح","خطأ"],1,"المقاصد جلبٌ للمصالح ودرءٌ للمفاسد معًا."],[198,7,"المقاصد التحسينية في الشريعة تتعلق بالأمور الضرورية التي تقام بها حياة الناس كالأكل والشرب الضروريين.",["صح","خطأ"],1,"العبارة خلطت بين رتبتين."],[199,7,"تساعد معرفة مقاصد الشريعة في المعاملات المالية على كشف أسرار التشريع وتوجيه الأحكام نحو تحقيق مصالح العباد ودرء المفاسد عنهم.",["صح","خطأ"],0,"كشف الأسرار وتحقيق المصالح."],[200,8,"ما المقصود بالضرورات الخمس في الشريعة الإسلامية والتي تسعى الأحكام الاقتصادية لحفظها؟",["التجارة والصناعة والزراعة والخدمات والاستثمار","الإنتاج والاستهلاك والادخار والتمويل والتوزيع","الدين والنفس والعقل والنسل والمال","الصدقة والزكاة والوقف والهبة والوصية"],2,"الكليات الخمس أولها الدين وآخرها المال."],[201,8,"ما الوسيلة الأساسية التي شرعتها الشريعة من جانبي الوجود لحفظ المال وتنميته؟",["الإنفاق المفتوح بلا قيود","التجارة المشروعة وتحريم الربا والغش","الاستدانة الربوية لتوسيع النشاط","اكتناز الأموال وتركها مجمدة"],1,"التنمية تكون بالكسب المشروع."],[202,8,"إلى أي مقصد عام تنضوي التشريعات الاقتصادية التي تمنع الغش والتدليس في الأسواق؟",["حفظ المال وحمايته من أكل أموال الناس بالباطل","حفظ العقل والكرامة الإنسانية","تيسير الإنفاق الاستهلاكي المفرط","تحقيق الرفاهية المطلقة دون ضوابط"],0,"الغش يأخذ أموال الناس… فأي ضرورة يمس؟"],[203,8,"يُقصد بحفظ المال في الشريعة إهمال تنميته وترك تداوله بين الناس وحصره في أيدٍ قليلة.",["صح","خطأ"],1,"الحفظ يشمل التنمية والتداول."],[204,8,"تعتبر التشريعات المالية الإسلامية حافظة للضرورات الخمس من خلال جلب المصالح ودرء المفاسد عن المكلفين.",["صح","خطأ"],0,"جلب ودرء = جانبا الحفظ."],[205,8,"عند تقييم سياسة اقتصادية تهدف إلى منع الاحتكار لتحقيق مصلحة المجتمع، أي من ضوابط إعمال المقاصد الآتية يجب مراعاتها لضمان صحة هذا التطبيق؟",["الاعتماد على المصلحة الوهمية دون اعتبار للنصوص","إلغاء حقوق الأفراد كلياً في سبيل المصلحة العامة","تجاهل الواقع الاقتصادي والاكتفاء بالعموميات","مراعاة المآلات وعدم معارضة النصوص القطعية"],3,"ضابطان مشهوران: المآل، وعدم معارضة النص."],[206,8,"مصرف إسلامي يدرس منتجاً تمويلياً جديداً، وعند عرضه على ضوابط إعمال المقاصد، تبين أنه يؤدي إلى تركيز الثروة في أيدي فئة قليلة مع الإضرار بالاقتصاد الحقيقي، فما الحكم المقاصدي لهذا المنتج؟",["يُمنع المنتج لمخالفته مقصد العدالة المالية وتوزيع الثروة","يُجيزه المقصد لأنه يحقق ربحاً للمصرف","يُترك تقييمه للمستهلك وحده دون رقابة","يُعتبر من التحسينيات التي لا تأثير لها"],0,"«كي لا يكون دولة بين الأغنياء منكم»."],[207,8,"عند تقييم العقود المالية المستجدة، كيف يتم إعمال مقاصد الشريعة بصورة صحيحة؟",["بالتركيز على الألفاظ والشكليات وإغفال الغايات والمقاصد","باعتماد أي عقد يحقق ربحاً مالياً سريعاً بغض النظر عن الضرر","بالنظر إلى مآلات العقود وأبعادها الاقتصادية والاجتماعية وغاياتها الكلية","بإلغاء جميع العقود الحديثة والكتفاء بالقديمة حصراً"],2,"المآلات والغايات."],[208,8,"عند تعارض مصلحة تحسينية مع مصلحة ضرورية في المعاملات المالية المعاصرة، فما هو الإجراء المقاصدي الصحيح؟",["تقديم الضرورية لأن حفظ الكليات الخمس مقدم على ما سواها","تقديم التحسينية لأنها تزيد الرفاهية للمجتمع","إلغاء المصلحتين معاً دفعاً للحرج","النظر إلى رغبة الأغلبية بغض النظر عن المقصد"],0,"الأعلى رتبة أولًا."],[209,8,"كيف يساهم تطبيق مقاصد الشريعة في مجال الاستثمار المالي المعاصر؟",["بالتركيز على المضاربات الوهمية التي تعتمد على الحظ البحت","بتوجيه الأموال نحو المشروعات النافعة التي تدعم الاقتصاد الحقيقي وتمنع الضرر","بتجاهل الجانب الأخلاقي والاجتماعي للشركات تماماً","بإباحة تمويل الأنشطة التي تضر بصحة المجتمع وبيئته مقابل عائد عالٍ"],1,"«الاقتصاد الحقيقي» لا الوهمي."],[210,8,"يُعد إعمال مقاصد الشريعة في الاقتصاد الإسلامي ترخيصاً لتجاوز القواعد الفقهية والأحكام القطعية متى ما رغب المستثمر في ذلك.",["صح","خطأ"],1,"المقاصد ليست بابًا للهوى."],[211,8,"إعمال المقاصد في الاقتصاد يعني الاعتماد على الأهواء الشخصية لتبرير المعاملات المالية المحرمة.",["صح","خطأ"],1,"المقاصد منضبطة بالشرع لا بالأهواء."],[212,8,"من ضوابط إعمال المقاصد في الاقتصاد الإسلامي ألا تُعطل النصوص الصحيحة الصريحة باسم المصلحة.",["صح","خطأ"],0,"من أهم الضوابط."],[213,8,"عند حدوث أزمة مالية عالمية، قامت جهة تنظيمية بوضع قيود على المضاربات الوهمية الصرفة حمايةً لاستقرار الأسواق، أي المقاصد الآتية يمثل المرتكز الأساسي لهذا القرار؟",["حفظ المال العام والخاص من الاندثار ومنع الغرر الفاحش","تحقيق الربح السريع للمؤسسات المالية الكبرى","إلغاء المعاملات التجارية كلياً","تشجيع الاستهلاك المفرط بين الأفراد"],0,"الهدف حماية المال لا الربح السريع."],[214,8,"شركة استثمارية قامت بتطبيق معايير مقاصد الشريعة بمنع تمويل الأنشطة الضارة بالبيئة والصحة، فهذا التطبيق يحقق حفظ أي من الضرورات بشكل أساسي؟",["حفظ العقل والمال فقط","حفظ النسل والمال وحدهما","حفظ الدين والنسل فقط","حفظ النفس والنسل والمال"],3,"الصحة تمس النفس، والبيئة تمس الأجيال، والتمويل يمس المال."],[215,8,"أي من الآتي يمثل تطبيقاً دقيقاً لقاعدة درء المفاسد مقدم على جلب المصالح في المعاملات المالية المعاصرة؟",["منع التمويل الذي يدخل فيه الغش والجهالة الفاحشة وإن فات بعض الربح المالي","السماح بالاستثمار في العملات الرقمية شديدة الاضطراب لتحقيق مكاسب عالية","إتاحة القروض بفائدة مركبة لتنشيط حركة الأسواق المالية السريعة","تشجيع المضاربات الوهمية لزيادة سيولة البورصة بصورة مؤقتة"],0,"ابحث عن خيار «يترك» ربحًا لأجل دفع مفسدة."],[216,8,"يجوز تعطيل مقصد حفظ المال وإهدافه بالمخاطر غير المدروسة بناءً على فهم خاطئ للمقاصد العامة.",["صح","خطأ"],1,"الفهم «الخاطئ» لا يُبنى عليه جواز."],[217,8,"تسعى التشريعات المالية المقاصدية إلى حفظ الضرورات الخمس عبر التوازن الدقيق بين حقوق الفرد والمجتمع وتجنب المفاسد الاقتصادية.",["صح","خطأ"],0,"التوازن بين الفرد والمجتمع سمة الاقتصاد الإسلامي."],[218,8,"يمكن تعطيل مقصد حفظ النسل أو العقل في سبيل تحقيق أرباح مالية ضخمة لبعض الشركات عبر إنتاج محرمات.",["صح","خطأ"],1,"هل يُضحّى بضرورة لأجل ربح؟"],[219,8,"يمكن تعديل الأحكام القطعية في المعاملات المالية بدعوى تغير العصور وتحقيق المصالح المزعومة.",["صح","خطأ"],1,"«القطعية» لا تتغير، والمصلحة «مزعومة»."],[220,8,"ما المعيار المقاصدي الحاكم لتصرفات المكلف المالية في الاقتصاد الإسلامي؟",["منع الضرر وتحقيق النفع العام والخاص ضمن حدود الشرع","تحقيق أعلى عائد مادي بأسرع وقت ممكن","مواكبة النظم الاقتصادية العالمية بغض النظر عن المصدر","الاستهلاك المطلق دون قيد أو شرط"],0,"منع ضرر + تحقيق نفع + حدود الشرع."],[221,8,"أي مما يلي يُعد من وسائل حفظ الضرورة المتعلقة بالمال في الإسلام؟",["تشريع العقوبات الرادعة لسرقة الأموال واختلاسها","إباحة الربا لزيادة السيولة النقدية","تشجيع الاكتناز المطلق لمنع تداول الأموال","إلغاء الملكية الفردية كلياً"],0,"هذه وسيلة من جانب «العدم» (حماية المال من الاعتداء)."],[222,8,"ما المقصود بحفظ المال باعتباره إحدى الضرورات الخمس في الشريعة الإسلامية؟",["إتلافه في الأمور المبتدعة","حمايته من الضياع ومنعه من التداول","حماية الأموال واستثمارها في الطرق المشروعة ومنع الاعتداء عليها","اكتنازه ليكون مصدر قوة فردية بحتة"],2,"الحفظ = حماية + استثمار مشروع."],[223,8,"ما المقصود بوسائل حفظ المال من جانب الوجود في الاقتصاد الإسلامي؟",["الأنظمة والتشريعات التي تحث على تنمية المال وكسبه بالطرق المشروعة وتداوله العادل","العقوبات الجنائية وحدها لمنع السرقة","منع الاستثمار الخارجي وحصر المال محلياً","الوسائل التي تمنع اكتساب المال وتوزيعه"],0,"جانب الوجود = الإيجاد والتنمية (أما العقوبات فمن جانب العدم)."],[224,8,"تتطلب عملية حفظ الضرورات الخمس في الاقتصاد الإسلامي الجمع بين جانبي الوجود بالتعمير والإيجاد، وجانب العدم بالمنع والدفع.",["صح","خطأ"],0,"للحفظ جانبان."],[225,8,"أي مما يلي يمثل الأسلوب الأمثل لإعمال المقاصد الشرعية عند معالجة أزمة مالية عالمية مستجدة؟",["الاعتماد على قياس المصلحة المرسلة بمعزل عن مقاصد الشارع الكلية","تفكيك الروابط الأخلاقية للتعامل المالي تيسيراً لحركة رؤوس الأموال","استصدار أحكام بمعزل عن مآلات الأفعال الاقتصادية وتبعاتها","مراعاة توازن السيولة وحماية الأصول الكلية ومنع الاحتكار والربا"],3,"ثلاثة خيارات فيها «بمعزل» أو «تفكيك»."],[226,8,"عند تعارض مصلحة حاجة تحويلية مع مصلحة ضرورية كلية في المال، فما القاعدة المتبعة في إعمال المقاصد؟",["تقدم الحاجة مطلقاً لأنها أيسر تطبيقاً","تُهدر الضرورة لصالح الحاجة إذا كثر المستفيدون","يتم دمج الأمرين بلا تفريق بين الرتبتين","تقدم الضرورة الكلية لحفظ نظام المال والعامة على الحاجة الجزئية"],3,"الضروري الكلي فوق الحاجي الجزئي."],[227,8,"كيف يساهم فهم ضوابط إعمال المقاصد في ضبط الممارسات الاستثمارية الحديثة كالمضاربة والمشاركة؟",["بالتأكد من خلوها من الظلم والغرر وتحقيقها للمنفعة التنموية الحقيقية","باعتبار الربح المادي هو المعيار الوحيد لصحة العقد","بتجاوز الشروط الفقهية للعقود إذا تعارضت مع الربحية","بمنع تداول الأسهم والصكوك نهائياً"],0,"الضبط = خلوّ من الظلم والغرر + نفع حقيقي."],[228,8,"عند معالجة نازلة مالية معاصرة باستخدام مقاصد الشريعة، ما هو الشرط الأساسي لصحة إعمال تلك المقاصد؟",["مخالفة الإجماع القديم لتحقيق مصلحة متوهمة","الاعتماد على رغبات السوق وحدها دون اعتبار للأحكام الحاكمة","إلغاء القيود الشكلية للعقود تماماً","أن تندرج المصلحة تحت أصل معتبر ولا تعارض نصاً قطعياً أو مقصداً أعظم"],3,"المصلحة المعتبرة لها شروط ثلاثة في هذا الخيار."],[229,8,"تعني المقاصد العامة للاقتصاد الإسلامي إخضاع النشاط المالي بالكامل لأهواء السوق والعرض والطلب الحر دون قيود أخلاقية.",["صح","خطأ"],1,"«دون قيود أخلاقية» تنافي المقاصد."],[230,8,"تعتبر تشريعات الزكاة والصدقات في الاقتصاد الإسلامي من أبرز الوسائل العملية لحفظ المال من جانب الوجود ومنع تركزه في أيدٍ محدودة.",["صح","خطأ"],0,"الزكاة تدوير للمال وتنمية له (والبنك يعدّها من جانب الوجود)."],[231,8,"ما هو الأثر المنهجي الأعظم لاعتبار مقاصد الشريعة في بناء نظريات التمويل والاستثمار في الاقتصاد الإسلامي؟",["فصل الدين عن النشاط الاقتصادي تماماً","ربط النمو المادي بالتنمية الاجتماعية وتحقيق العدالة وتوزيع المخاطر","التركيز على تعظيم الربح المالي بغض النظر عن الأضرار البيئية أو الاجتماعية","إلغاء دور المصارف التجارية والاسلامية معاً"],1,"المقاصد «تربط» لا «تفصل»."],[232,8,"كيف يسهم فهم الضوابط المقاصدية لإعمال النصوص في المعاملات الاقتصادية المعاصرة في ترسيخ البناء المعرفي للاقتصاد الإسلامي؟",["بالتوفيق بين جلب المنافع ودرء المفاسد وفق ترتيب الضرورات والحاجيات والتحسينيات","بالاعتماد على ظاهر اللفظ دون اعتبار للمآلات والمقاصد العامة","بإلغاء النصوص الشرعية والاعتماد الكلي على المعايير الاقتصادية الوضعية","بجعل الأحكام الاقتصادية متغيرة بلا ضوابط مستقرة"],0,"الخيار الصحيح يذكر ترتيب الرتب الثلاث."],[233,8,"ما التفسير المقاصدي الدقيق لتحريم الشريعة للغرر والجهالة في المعاملات المالية؟",["لأنها تمنع تكوين الثروات الفردية المطلقة","لأنها تؤدي إلى أكل أموال الناس بالباطل وتنازع القلوب وإهدار مقصود حفظ المال","لأنها تعيق حركة المصارف المركزية عن العمل","لأنها تتعارض مع القوانين الوضعية الدولية فحسب"],1,"الغرر يورث النزاع ويضيّع المال."],[234,8,"من ضوابط إعمال المقاصد في المعاملات المالية المعاصرة ألا يُلغى النص الشرعي الصحيح الصريح بدعوى جلب مصلحة متهمة.",["صح","خطأ"],0,"النص مقدّم على المصلحة المتوهمة."],[235,8,"يُعد إعمال مقاصد الشريعة في النوازل الاقتصادية مقدماً على النصوص الخاصة مطلقاً ولو خالفت صريح الإجماع القطعي.",["صح","خطأ"],1,"«مطلقًا» و«ولو خالفت الإجماع» علامات خطأ."],[236,9,"ما المقصود الأساسي من تشريع أحكام المال والمعاملات في الشريعة الإسلامية؟",["جمع المال بأي وسيلة بغض النظر عن مصدره","إنفاق جميع الأموال في وجوه البر وترك الاستثمار","حفظ المال واستثماره بالطرق المشروعة ومنع الاعتداء عليه","منع تملك الأفراد للأموال وجعلها دولة بين الأغنياء"],2,"الحفظ + الاستثمار المشروع + منع الاعتداء."],[237,9,"جاءت الشريعة الإسلامية بجواز اكتساب المال بكل الطرق المتاحة بغض النظر عن الوسيلة.",["صح","خطأ"],1,"الكسب مقيّد بالمشروع."],[238,9,"تشرع أحكام المعاملات المالية لحفظ أموال الناس ومنع الاعتداء عليها بالباطل.",["صح","خطأ"],0,"هذا من صميم مقصد حفظ المال."],[239,9,"يُعد المال في المنظور الإسلامي أمانة استخلف الله الإنسان فيها لتقسيمه وتنميته وفق شرعه.",["صح","خطأ"],0,"«وأنفقوا مما جعلكم مستخلفين فيه»."],[240,9,"يقتصر مفهوم حفظ المال في الشريعة الإسلامية على تنميته وزيادته فقط دون اعتبارات أخرى.",["صح","خطأ"],1,"«يقتصر» و«فقط»؛ والحفظ له جانبان."],[241,9,"تعتبر الشريعة المال غاية في ذاته يجب السعي لتحصيله ولو خالفت الوسيلة المقاصد العامة.",["صح","خطأ"],1,"المال وسيلة لا غاية."],[242,9,"كيف يؤثر اعتبار مآلات الأفعال في الترجيح بين الآراء الفقهية لمعاملة مالية معاصرة مستجدة؟",["باستبعاد الحكم الجائز إذا كانت مآلاته تفضي إلى المفاسد العامة واضطراب السوق","بالتغاضي عن النتائج المستقبلية والتركيز على ظاهر العقد فقط","بالاعتداد بالنية وحدها دون النظر إلى النتائج العملية للمعاملة","باختيار الحكم الأسهل بغض النظر عن الأثر الاقتصادي المترتب عليه"],0,"المآل = النتيجة؛ فالخيار الصحيح يحكم بالنتائج."],[243,9,"عند اختلاف الفقهاء في ترجيح حكم معاملة مالية معاصرة تكتنفها شبهة الضرر الاقتصادي العام، ما المعيار المقاصدي الأرجح للاعتماد عليه؟",["تقديم المصلحة الخاصة للعميل على المصلحة العامة مطلقا","النظر إلى الربحية السريعة للشركة الممولة","درء المفاسد العامة ومقدمات الضرر على جلب المصالح الجزئية","الاعتداد برأي الجمهور بغض النظر عن مآلات المعاملة"],2,"العام مقدّم على الخاص، والدرء على الجلب."],[244,9,"تعد حماية الأموال من الهدر والتبذير من أهم الوسائل التي شرعتها الشريعة لحفظ المال.",["صح","خطأ"],0,"«إن المبذرين كانوا إخوان الشياطين»."],[245,9,"يبيح الفقه الإسلامي إتلاف الأموال وإهدارها في الاستهلاك الترفي طالما كان المال مملوكاً للشخص وحده.",["صح","خطأ"],1,"الملكية لا تبيح الإتلاف والتبذير."],[246,9,"مراعاة مآلات العقود المالية المعاصرة تعد أصلاً معتبراً عند المجتهد للترجيح بين الأقوال الفقهية المختلفة في النوازل الاقتصادية.",["صح","خطأ"],0,"اعتبار المآل أصل معتبر."],[247,9,"إباحة المعاملات المالية المعاصرة للمصارف الإسلامية ترتبط ارتباطاً وثيقاً برفع الحرج وتحقيق التيسير المقاصدي.",["صح","خطأ"],0,"رفع الحرج مقصد شرعي."],[248,9,"حفظ المال يتضمن جانبين أساسيين هما جانب الإيجاد والتنمية وجانب العدم والحماية.",["صح","خطأ"],0,"الوجود والعدم."],[249,9,"يقتصر مفهوم حفظ المال في الشريعة على حمايته من السرقة فقط دون اعتبارات الاستثمار أو منع التبذير.",["صح","خطأ"],1,"«يقتصر… فقط» مرة أخرى."],[250,9,"عند التعارض بين مصلحة المستثمر الفرد في تعظيم الربح عبر عقود مستحدثة محتملة للغرر، ومصلحة
