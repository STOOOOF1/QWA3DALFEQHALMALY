ق عائد ربحي استثماري مرتفع للأوقاف الخاصة بالدولة","تحويل الأموال المجمدة إلى أصول استهلاكية سريعة التداول","إسقاط الديون المتعثرة عن طريق الدعم المالي المؤقت للمدينين","تحقيق التكافل المستدام وتدوير الثروة وخدمة التنمية المجتمعية"],3,"الوقف والقرض الحسن: تكافل مستدام وتدوير للثروة."],[291,10,"عند النظر في مقاصد الكسب والاستثمار المالي، ما هو المعيار المقاصدي الأساسي الذي يُميز الاستثمار المشروع عن غيره في الاقتصاد الإسلامي؟",["تحقيق أعلى عائد مالي بغض النظر عن طبيعة النشاط الاقتصادي","الارتباط الحقيقي بالأصول الدارجة وتحقيق النفع العام ورفع الضرر","الاعتماد على المضاربة البحتة في الأسواق المالية العالمية المفتوحة","تركيز الربح في يد المستثمر الأساسي لضمان استمرارية السوق"],1,"الاستثمار المشروع مرتبط بأصول حقيقية ونفع عام."],[292,10,"تسعى مقاصد الشريعة في باب الكسب إلى حماية الحقوق وتحقيق الرضا المتبادل ومنع الغرر والجهالة.",["صح","خطأ"],0,"الكسب المشروع: رضا وحماية حقوق ومنع غرر."],[293,10,"يقصد بمقاصد الاستهلاك في الاقتصاد الإسلامي الإسراف المباح لتحقيق الرفاهية المطلقة للمستهلك.",["صح","خطأ"],1,"«الإسراف المباح» عبارة متناقضة."],[294,10,"تقوم المعاملات المالية المعاصرة على مبدأ إباحة كل أشكال العقود حتى وإن اشتملت على جهالة فاحشة أو ربا.",["صح","خطأ"],1,"الجهالة الفاحشة والربا لا يبيحهما شيء."],[295,10,"كيف يظهر أثر مقاصد الشريعة في صياغة العقود المالية المستجدة كالتوريق المالي والتأمين التعاوني؟",["من خلال تكييف العقود لتتفق مع القواعد الشكلية البحتة متجاوزة المآلات","بتوجيه العقد لتحقيق التوازن بين المنفعة الخاصة والمصلحة العامة ومنع الاحتكار","بإلغاء المعايير الشرعية تماماً إذا تعارضت مع كفاءة الكسب السريع","بجعل العقود تدور حول تعظيم السيولة النقدية بصرف النظر عن المخاطر"],1,"التوازن بين الخاص والعام ومنع الاحتكار."],[296,10,"كيف يسهم التفريق بين مقاصد الكسب والاستثمار ومقاصد الاستهلاك في ترسيخ البناء المعرفي للاقتصاد الإسلامي؟",["بإثبات أن الإنفاق الاستهلاكي يتقدم دائماً على الاستثمار في المراتب الضرورية","بتأكيد تكامل الوظائف المالية بحيث يكون الاستثمار خادماً للتنمية والعدالة والاستهلاك محققاً للكفاية","بجعل التبرعات المالية هي المصدر الرئيس الوحيد لدوران عجلة الاقتصاد والإنتاج","بفصل الجانب الأخلاقي عن الكسب المالي وجعله مقصوراً على باب الاستهلاك فقط"],1,"الوظائف المالية متكاملة: استثمار للتنمية واستهلاك للكفاية."],[297,10,"ما هو الأثر المعرفي والمنهجي المترتب على إدماج مقاصد الشريعة في دراسة المعاملات المالية المعاصرة؟",["الاستغناء الكامل عن قواعد أصول الفقه والاعتماد على التحليل المالي الرياضي الحديث","إلغاء الفروق الجوهرية بين التمويل الإسلامي والتمويل التقليدي في صيغ العقود","قصر النظر الفقهي على الظاهر اللفظي للعقود دون اعتبار للمآلات الاقتصادية","تحويل الفقه المالي من مجموعة أحكام جزئية مفرقة إلى منظومة متسقة تحقق مصالح العباد"],3,"من «أحكام جزئية مفرّقة» إلى «منظومة متسقة»."],[298,10,"يُعد التبذير والإسراف في الإنفاق الاستهلاكي وسيلة معتبرة شرعاً لتحقيق مقاصد حفظ المال.",["صح","خطأ"],1,"التبذير ينافي حفظ المال."],[299,10,"تتكامل مقاصد الكسب والاستثمار والإنفاق لترسيخ البناء المعرفي للاقتصاد الإسلامي القائم على الوسطية والعدل.",["صح","خطأ"],0,"التكامل والوسطية والعدل."],[300,10,"تؤثر مقاصد الشريعة الإسلامية في توجيه المعاملات المالية المعاصرة نحو تحقيق التداول العادل للثروة ومنع تركزها.",["صح","خطأ"],0,"التداول العادل ومنع التركّز من مقاصد المال."]]; // [n, topic, question, options, answerIndex, hint]
const PER=20, NSETS=Math.ceil(Q.length/PER), LET=['أ','ب','ج','د'];
const KEY='qwa3d-quiz-v1';
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let S={cur:0,sets:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.sets)S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function st(i){return S.sets[i]||(S.sets[i]={a:{},c:{},f:false});}
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
function qsOf(i){return Q.slice(i*PER,i*PER+PER);}
function score(i){const s=st(i);let r=0,shown=0;qsOf(i).forEach(q=>{if(s.f||s.c[q[0]]){shown++;if(s.a[q[0]]===q[4])r++;}});return{r,shown};}
function renderSets(){
  const box=document.getElementById('sets');box.innerHTML='';let tot=0,totR=0;
  for(let i=0;i<NSETS;i++){
    const qs=qsOf(i),s=st(i),sc=score(i);
    const b=document.createElement('button');b.className='set'+(i===S.cur?' on':'')+(s.f?' done':'');
    const lab=s.f?ar(sc.r)+'/'+ar(qs.length):ar(qs[0][0])+'–'+ar(qs[qs.length-1][0]);
    b.innerHTML='<b>'+ar(i+1)+'</b><small>'+lab+'</small>';
    b.onclick=()=>{S.cur=i;save();render();window.scrollTo({top:0,behavior:'smooth'});};
    box.appendChild(b);
    if(s.f){tot+=qs.length;totR+=sc.r;}
  }
  document.getElementById('overall').textContent=tot?('مجموعك: '+ar(totR)+' من '+ar(tot)):'';
}
function status(){
  const i=S.cur,s=st(i),qs=qsOf(i);const answered=qs.filter(q=>s.a[q[0]]!==undefined).length;
  document.getElementById('stTitle').textContent='المجموعة '+ar(i+1)+' · الأسئلة '+ar(qs[0][0])+'–'+ar(qs[qs.length-1][0]);
  const sc=score(i);
  document.getElementById('stCount').textContent=s.f?('النتيجة: '+ar(sc.r)+' / '+ar(qs.length)):('أجبت '+ar(answered)+' من '+ar(qs.length)+(sc.shown?(' · صحيح '+ar(sc.r)+' من '+ar(sc.shown)):''));
  document.getElementById('stBar').style.width=(answered/qs.length*100)+'%';
  document.getElementById('finishBtn').style.display=s.f?'none':'';
  document.getElementById('nextBtn').style.display=i<NSETS-1?'':'none';
}
function paintQ(el,q){
  const s=st(S.cur),n=q[0],sel=s.a[n],shown=!!(s.f||s.c[n]);
  el.classList.remove('right','wrong','miss');
  el.querySelectorAll('.op').forEach((b,k)=>{
    b.classList.toggle('sel',sel===k&&!shown);
    b.classList.toggle('good',shown&&k===q[4]);
    b.classList.toggle('bad',shown&&sel===k&&k!==q[4]);
  });
  el.querySelector('.opts').classList.toggle('locked',!!shown);
  const chk=el.querySelector('.chk'),res=el.querySelector('.res');
  chk.style.display=shown?'none':'';chk.disabled=sel===undefined;
  if(!shown){res.className='res';res.innerHTML='';return;}
  const ca='<span class="ca">الإجابة الصحيحة: <b>'+(q[3].length===4?LET[q[4]]+') ':'')+esc(q[3][q[4]])+'</b></span>';
  if(sel===undefined){el.classList.add('miss');res.className='res m';res.innerHTML='— لم تُجب عن هذا السؤال'+ca;}
  else if(sel===q[4]){el.classList.add('right');res.className='res r';res.innerHTML='✓ إجابة صحيحة';}
  else{el.classList.add('wrong');res.className='res w';res.innerHTML='✗ إجابة خاطئة'+ca;}
}
function render(){
  renderSets();
  const i=S.cur,s=st(i),box=document.getElementById('qs');box.innerHTML='';
  qsOf(i).forEach(q=>{
    const [n,t,txt,opts,ans,hint]=q,tf=opts.length===2;
    const el=document.createElement('article');el.className='q';el.id='q'+n;
    el.innerHTML='<div class="qin"><div class="qmeta"><span class="qn">السؤال '+ar(n)+'</span><span class="tp">'+TOPICS[t-1]+'</span></div>'+
      '<div class="qt">'+esc(txt)+(tf?'<span class="tf">صح أو خطأ</span>':'')+'</div>'+
      '<div class="opts'+(tf?' tfo':'')+'">'+opts.map((o,k)=>'<button class="op" data-k="'+k+'">'+(tf?'':'<span class="l">'+LET[k]+'</span>')+'<span>'+esc(o)+'</span></button>').join('')+'</div>'+
      '<details class="hint"><summary>💡 تلميح</summary><p>'+esc(hint)+'</p></details>'+
      '<div class="qact"><button class="btn chk">تحقق</button><div class="res"></div></div></div>';
    el.querySelectorAll('.op').forEach(b=>b.onclick=()=>{
      if(s.f||s.c[n])return;s.a[n]=+b.dataset.k;save();paintQ(el,q);status();});
    el.querySelector('.chk').onclick=()=>{if(s.a[n]===undefined)return;s.c[n]=1;save();paintQ(el,q);status();renderSets();};
    paintQ(el,q);box.appendChild(el);
  });
  summary();status();
}
function summary(){
  const i=S.cur,s=st(i),box=document.getElementById('summary');
  if(!s.f){box.classList.remove('show');box.innerHTML='';return;}
  const qs=qsOf(i),sc=score(i),pct=Math.round(sc.r/qs.length*100);
  const wr=qs.filter(q=>s.a[q[0]]!==undefined&&s.a[q[0]]!==q[4]),ms=qs.filter(q=>s.a[q[0]]===undefined);
  const msg=pct>=90?'ممتاز! أتقنت هذه المجموعة 🌟':pct>=70?'جيد جدًا، راجع ما أخطأت فيه 👍':pct>=50?'لا بأس، راجع الأخطاء ثم أعد المجموعة':'تحتاج مراجعة؛ اقرأ الإجابات الصحيحة وأعد المحاولة';
  box.innerHTML='<div class="big">'+ar(sc.r)+'<small> / '+ar(qs.length)+'</small></div><p>'+ar(pct)+'٪ · '+msg+'</p>'+
   ((wr.length||ms.length)?'<div class="chips">'+wr.map(q=>'<a class="w" href="#q'+q[0]+'">س'+ar(q[0])+'</a>').join('')+ms.map(q=>'<a class="m" href="#q'+q[0]+'">س'+ar(q[0])+'</a>').join('')+'</div><p style="font-size:13px;margin-top:-6px">الأحمر: إجابة خاطئة · الأصفر: لم تُجب — اضغط لتنتقل إلى السؤال</p>':'')+
   '<button class="btn sec" onclick="resetSet()">أعد المجموعة</button>'+(i<NSETS-1?'<button class="btn pri" onclick="go(1)">المجموعة التالية ←</button>':'');
  box.classList.add('show');
}
function finish(){
  const i=S.cur,s=st(i),qs=qsOf(i);const left=qs.filter(q=>s.a[q[0]]===undefined).length;
  if(left&&!confirm('بقي '+ar(left)+' سؤال بلا إجابة، وستُحسب خاطئة. هل تريد عرض النتيجة؟'))return;
  s.f=true;save();render();document.getElementById('summary').scrollIntoView({behavior:'smooth'});
}
function resetSet(){S.sets[S.cur]={a:{},c:{},f:false};save();render();window.scrollTo({top:0,behavior:'smooth'});toast('بدأت المجموعة من جديد');}
function go(d){S.cur=Math.min(NSETS-1,Math.max(0,S.cur+d));save();render();window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('finishBtn').onclick=finish;
document.getElementById('nextBtn').onclick=()=>go(1);
document.getElementById('resetBtn').onclick=()=>{if(confirm('مسح إجابات هذه المجموعة والبدء من جديد؟'))resetSet();};
render();
</script>
